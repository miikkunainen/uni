<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 780" width="680" height="780" role="img" aria-label="Metropolian pajat — Teollinen muotoilu">
<title>Teollinen muotoilu — laattatunnus</title>
<desc>Metallinen laattatunnus: kruunu, teksti Metropolian pajat ja Teollinen muotoilu, työntömitta asteikkoineen sekä kolme kuutiota.</desc>

<defs>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#C9CDD2"/>
    <stop offset="0.45" stop-color="#9BA3AB"/>
    <stop offset="0.55" stop-color="#8A929A"/>
    <stop offset="1" stop-color="#B4BBC1"/>
  </linearGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#BAC1C7"/>
    <stop offset="0.5" stop-color="#98A0A8"/>
    <stop offset="1" stop-color="#7E868E"/>
  </linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#D9A441"/>
    <stop offset="1" stop-color="#A6761F"/>
  </linearGradient>
  <style>
    .t{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:800;text-transform:uppercase;}
  </style>
</defs>

<!-- Tausta: poista nämä kaksi riviä, jos haluat läpinäkyvän tunnuksen -->
<rect x="0" y="0" width="680" height="780" fill="#241F1A"/>
<rect x="34" y="34" width="612" height="712" rx="18" fill="#2E2822"/>

<!-- KRUUNU -->
<g>
  <path d="M196 214 L196 150 L232 178 L262 118 L296 172 L340 108 L384 172 L418 118 L448 178 L484 150 L484 214 Z"
        fill="url(#steel)" stroke="#5E666E" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="262" cy="140" r="9" fill="#CE3F1B" stroke="#5E666E" stroke-width="3"/>
  <circle cx="340" cy="130" r="10" fill="#CE3F1B" stroke="#5E666E" stroke-width="3"/>
  <circle cx="418" cy="140" r="9" fill="#CE3F1B" stroke="#5E666E" stroke-width="3"/>
</g>

<!-- LAATTA -->
<rect x="76" y="206" width="528" height="392" rx="34" fill="#5E666E"/>
<rect x="86" y="216" width="508" height="372" rx="28" fill="url(#plate)"/>
<rect x="104" y="234" width="472" height="336" rx="20" fill="none" stroke="#6E767E" stroke-width="4"/>

<!-- TEKSTI -->
<text class="t" x="340" y="292" text-anchor="middle" fill="#3D444A" font-size="26" letter-spacing="6">METROPOLIAN PAJAT</text>
<text class="t" x="340" y="362" text-anchor="middle" fill="#2C3237" font-size="64" letter-spacing="1">TEOLLINEN</text>
<text class="t" x="340" y="428" text-anchor="middle" fill="#2C3237" font-size="64" letter-spacing="1">MUOTOILU</text>

<!-- TYÖNTÖMITTA -->
<g>
  <rect x="128" y="470" width="424" height="26" rx="4" fill="url(#steel)" stroke="#5E666E" stroke-width="3"/>
  <g stroke="#4E565E" stroke-width="2.5" stroke-linecap="round">
    <line x1="152" y1="470" x2="152" y2="484"/><line x1="176" y1="470" x2="176" y2="478"/>
    <line x1="200" y1="470" x2="200" y2="484"/><line x1="224" y1="470" x2="224" y2="478"/>
    <line x1="248" y1="470" x2="248" y2="484"/><line x1="272" y1="470" x2="272" y2="478"/>
    <line x1="296" y1="470" x2="296" y2="484"/><line x1="320" y1="470" x2="320" y2="478"/>
    <line x1="344" y1="470" x2="344" y2="484"/><line x1="368" y1="470" x2="368" y2="478"/>
    <line x1="392" y1="470" x2="392" y2="484"/><line x1="416" y1="470" x2="416" y2="478"/>
    <line x1="440" y1="470" x2="440" y2="484"/><line x1="464" y1="470" x2="464" y2="478"/>
    <line x1="488" y1="470" x2="488" y2="484"/><line x1="512" y1="470" x2="512" y2="478"/>
  </g>

  <!-- kiinteä leuka -->
  <path d="M128 470 L128 552 L146 552 L146 496 L128 496 Z" fill="url(#steel)" stroke="#5E666E" stroke-width="3" stroke-linejoin="round"/>
  <path d="M128 552 L146 552 L146 574 L132 574 Z" fill="#8A929A" stroke="#5E666E" stroke-width="3" stroke-linejoin="round"/>

  <!-- liukuleuka ja nonius -->
  <rect x="236" y="462" width="104" height="70" rx="5" fill="url(#steel)" stroke="#5E666E" stroke-width="3"/>
  <g stroke="#4E565E" stroke-width="2" stroke-linecap="round">
    <line x1="250" y1="506" x2="250" y2="518"/><line x1="264" y1="506" x2="264" y2="518"/>
    <line x1="278" y1="506" x2="278" y2="518"/><line x1="292" y1="506" x2="292" y2="518"/>
    <line x1="306" y1="506" x2="306" y2="518"/><line x1="320" y1="506" x2="320" y2="518"/>
  </g>
  <path d="M236 532 L254 532 L254 574 L240 574 Z" fill="#8A929A" stroke="#5E666E" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="316" cy="540" r="13" fill="#8A929A" stroke="#5E666E" stroke-width="3"/>
  <rect x="486" y="452" width="18" height="26" rx="3" fill="#8A929A" stroke="#5E666E" stroke-width="3"/>
</g>

<!-- KOLME KUUTIOTA -->
<g>
  <rect x="272" y="616" width="34" height="34" rx="4" fill="url(#brass)" stroke="#7A5514" stroke-width="3"/>
  <rect x="323" y="616" width="34" height="34" rx="4" fill="#CE3F1B" stroke="#7A2A0E" stroke-width="3"/>
  <rect x="374" y="616" width="34" height="34" rx="4" fill="url(#brass)" stroke="#7A5514" stroke-width="3"/>
</g>

<!-- NAUHA -->
<rect x="216" y="682" width="248" height="40" rx="6" fill="url(#brass)" stroke="#7A5514" stroke-width="3"/>
<text class="t" x="340" y="710" text-anchor="middle" fill="#2E2822" font-size="19" letter-spacing="4">ARABIAN KAMPUS</text>
</svg>
