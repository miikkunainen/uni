<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kemikaalirekisteri — käyttöturvallisuustiedotteet, säilytys ja käyttö</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ECE6DA;--paper-deep:#E4DCCC;--card:#F3EFE7;--ink:#211C16;--ink-soft:#5A5347;
    --ember:#CE3F1B;--rule:#C8BFAD;--rule-soft:#D8D0C0;
    --vihrea:#5E8C5A;--oikeus:#4F6E92;--turva:#C25A3E;--laatu:#BE8A2E;--projekti:#6E5A93;--talous:#4E8C84;--steel:#3D4B58;--wood:#B0712F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Spectral",Georgia,serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 clamp(12px,3vw,26px) 60px;}
  h1,h2,h3,h4,h5{font-family:"Big Shoulders Display",Arial,sans-serif;font-weight:800;text-transform:uppercase;line-height:.95;margin:0;}
  .mono{font-family:"IBM Plex Mono",monospace;}
  p{margin:0 0 1em;}

  .head{padding:clamp(20px,4vw,34px) 0 10px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;}
  .head h1{font-size:clamp(1.8rem,5vw,2.9rem);}
  .head h1 .e{color:var(--ember);}
  .head p{color:var(--ink-soft);font-size:.92rem;max-width:64ch;margin:.4em 0 0;}
  .modebadge{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;padding:.4em .7em;border-radius:20px;}
  .modebadge.on{background:rgba(206,63,27,.12);color:#8f2a10;border:1px solid var(--ember);}
  .modebadge.off{background:var(--paper-deep);color:var(--ink-soft);border:1px solid var(--rule);}

  .tabs{position:sticky;top:0;z-index:20;background:var(--paper);display:flex;gap:4px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--rule);}
  .tab{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;cursor:pointer;border:1px solid var(--rule);background:var(--card);color:var(--ink-soft);padding:.55em .8em;border-radius:20px;flex:none;}
  .tab:hover{border-color:var(--ink-soft);color:var(--ink);}
  .tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .tab .badge{background:var(--ember);color:#fff;border-radius:20px;padding:0 .4em;margin-left:.3em;font-size:.9em;}

  .view{padding-top:18px;}
  .lead{color:var(--ink-soft);font-size:.93rem;max-width:74ch;margin:0 0 14px;}
  .panel{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;margin-bottom:14px;}
  .panel h3{font-size:1.15rem;margin-bottom:.4em;}
  .kicker{font-family:"IBM Plex Mono",monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ember);font-weight:600;display:block;margin-bottom:.25em;}

  .btn{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:.5em .85em;border-radius:3px;}
  .btn:hover{background:var(--ink);color:var(--paper);}
  .btn.primary{background:var(--ember);border-color:var(--ember);color:#fff;}
  .btn.primary:hover{background:#b0340f;}
  .btn.ok{background:var(--vihrea);border-color:var(--vihrea);color:#fff;}
  .btn.ghost{border-color:var(--rule);color:var(--ink-soft);}
  .btn.mini{font-size:.55rem;padding:.32em .55em;}
  .btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}

  .field{margin:.5em 0;}
  .field label{display:block;font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.2em;}
  .field input,.field select,.field textarea{width:100%;font-family:"Spectral",serif;font-size:.96rem;padding:.5em .6em;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink);}
  .field textarea{resize:vertical;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--ember);border-color:var(--ember);}
  .inline{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;}
  .inline .field{flex:1;min-width:150px;margin:0;}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px;}
  .kpi{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;}
  .kpi .k{font-family:"IBM Plex Mono",monospace;font-size:.56rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);}
  .kpi .v{font-family:"Big Shoulders Display",Arial,sans-serif;font-weight:800;font-size:2rem;line-height:1;margin-top:.1em;}

  .clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
  .ccard{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--steel);border-radius:8px;padding:12px 14px;cursor:pointer;}
  .ccard:hover{border-color:var(--ink-soft);}
  .ccard.h4,.ccard.h5{border-left-color:var(--ember);}
  .ccard.h3{border-left-color:var(--laatu);}
  .ccard.h1,.ccard.h2{border-left-color:var(--vihrea);}
  .ccard h4{font-size:1.05rem;line-height:1.05;}
  .ccard .sup{font-family:"IBM Plex Mono",monospace;font-size:.58rem;color:var(--ink-soft);margin-top:.15em;}
  .ccard .loc{font-size:.82rem;color:var(--ink-soft);margin-top:.35em;}
  .pill{font-family:"IBM Plex Mono",monospace;font-size:.52rem;letter-spacing:.06em;text-transform:uppercase;padding:.22em .5em;border-radius:20px;display:inline-block;margin:.15em .2em .15em 0;}
  .p-ppe{background:var(--paper-deep);color:var(--ink);border:1px solid var(--rule);}
  .p-ghs{background:#fff;color:#8f2a10;border:1px solid var(--ember);}
  .p-asa{background:var(--ember);color:#fff;}
  .p-odottaa{background:rgba(190,138,46,.25);color:#7a5a12;}
  .p-hyvaksytty{background:rgba(94,140,90,.22);color:#3c5e39;}
  .p-hylatty{background:rgba(206,63,27,.16);color:#8f2a10;}
  .sev{font-family:"IBM Plex Mono",monospace;font-size:.6rem;color:var(--ink-soft);display:inline-flex;align-items:center;gap:5px;margin-top:.3em;}
  .sev .b{letter-spacing:-1px;}
  .sev .on{color:var(--ember);}.sev .off{color:var(--rule);}

  .detail{background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:16px 18px;margin-bottom:14px;}
  .detail h3{font-size:1.5rem;}
  .drow{display:flex;gap:10px;padding:.45em 0;border-top:1px dashed var(--rule);font-size:.92rem;}
  .drow .dl{font-family:"IBM Plex Mono",monospace;font-size:.58rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);min-width:120px;flex:none;padding-top:.2em;}
  .warnbox{background:rgba(206,63,27,.1);border-left:4px solid var(--ember);border-radius:4px;padding:.6em .8em;font-size:.88rem;margin-top:.6em;}
  .okbox{background:rgba(94,140,90,.12);border-left:4px solid var(--vihrea);border-radius:4px;padding:.6em .8em;font-size:.88rem;margin-top:.6em;}

  .msg{font-size:.85rem;padding:.5em .7em;border-radius:4px;margin-top:.5em;}
  .msg.ok{background:rgba(94,140,90,.12);border-left:3px solid var(--vihrea);color:#3c5e39;}
  .msg.err{background:rgba(206,63,27,.1);border-left:3px solid var(--ember);color:#8f2a10;}
  .msg.info{background:var(--paper-deep);border-left:3px solid var(--steel);color:var(--ink-soft);}

  .logline{font-family:"IBM Plex Mono",monospace;font-size:.68rem;padding:.4em 0;border-bottom:1px dashed var(--rule);display:flex;gap:10px;flex-wrap:wrap;}
  .logline .ts{color:var(--ink-soft);white-space:nowrap;}

  .note{font-family:"IBM Plex Mono",monospace;font-size:.62rem;color:var(--ink-soft);line-height:1.75;margin-top:16px;border-top:1px solid var(--rule);padding-top:10px;}
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="mhks-icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-180.png">
</head>

<script src="paja-data.js"></script>
<script>
/* Varmistus: jos jaettu tietolähde ei latatunut, kerro se näkyvästi.
   Hiljainen tyhjä lista on turvallisuustyökalussa vaarallinen. */
(function(){
  if(window.PAJA) return;
  document.addEventListener("DOMContentLoaded", function(){
    var d=document.createElement("div");
    d.setAttribute("role","alert");
    d.style.cssText="position:sticky;top:0;z-index:9999;background:#CE3F1B;color:#fff;padding:12px 16px;"
      + "font-family:'IBM Plex Mono',monospace;font-size:.78rem;line-height:1.6;";
    d.innerHTML="<b>Tietolähde puuttuu.</b> Tiedosto paja-data.js ei latautunut, joten koneet, tilat ja "
      + "suojaimet eivät näy. Varmista että kaikki tiedostot ovat samassa kansiossa. "
      + "Älä käytä tätä sivua ohjeena ennen kuin tieto näkyy.";
    document.body.insertBefore(d, document.body.firstChild);
  });
})();
</script>

<script src="pajakuutio-nav.js"></script>
<div class="wrap">

  <header class="head">
    <div>
      <h1>Kemikaali<span class="e">rekisteri</span></h1>
      <p>Käyttöturvallisuustiedotteet, säilytys- ja käyttöpaikat. Opiskelija selaa ja lukee; henkilökunta syöttää PRO24-aineet ja hyväksyy ehdotukset.</p>
    </div>
    <span class="modebadge off" id="modeBadge">Opiskelijan tila</span>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main class="view" id="view"></main>
  <div class="note" id="note"></div>
</div>

<script>
(function(){
  "use strict";
  var KEY="paja_kemikaalirekisteri_v1";
  var STAFF=false;
  var current="selaa";
  var openId="";
  var q="";
  var areaFilter="";

  var AREAS=(window.PAJA?PAJA.roomNames():[]);
  var PPE=(window.PAJA?PAJA.ppe():[]);
  var GHS=[
    { c:"GHS02", t:"Syttyvä" },{ c:"GHS05", t:"Syövyttävä" },{ c:"GHS06", t:"Myrkyllinen" },
    { c:"GHS07", t:"Ärsyttävä" },{ c:"GHS08", t:"Terveysvaara" },{ c:"GHS09", t:"Ympäristövaara" }
  ];

  var DB={ items:[], log:[], pin:"", sync:{ endpoint:"", apiKey:"", field:"" } };
  function load(){ try{ var s=localStorage.getItem(KEY); if(s){ var d=JSON.parse(s); DB.items=d.items||[]; DB.log=d.log||[]; DB.pin=d.pin||""; DB.sync=d.sync||{ endpoint:"", apiKey:"", field:"" }; } }catch(e){} }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); return true; }catch(e){ flash("Tallennus ei onnistunut.","err"); return false; } }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function nowISO(){ return new Date().toISOString(); }
  function fmt(iso){ if(!iso) return "–"; var d=new Date(iso); function p(n){ return (n<10?"0":"")+n; }
    return d.getDate()+"."+(d.getMonth()+1)+"."+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes()); }
  function fmtD(iso){ if(!iso) return "–"; var p=String(iso).split("-"); if(p.length<3) return iso; return parseInt(p[2],10)+"."+parseInt(p[1],10)+"."+p[0]; }
  function uid(){ return "k"+Math.random().toString(36).slice(2,8); }
  function yearsSince(d){ if(!d) return null; var t=new Date(d).getTime(); if(isNaN(t)) return null; return (Date.now()-t)/(365.25*24*3600000); }
  function logAdd(kind,ref,text,by){ DB.log.push({ ts:nowISO(), kind:kind, ref:ref, text:text, by:by }); }

  var flashMsg=null;
  function flash(t,k){ flashMsg={t:t,k:k}; render(); }

  function sevBlocks(n){
    var on="",off="",i; n=n||1;
    for(i=0;i<n;i++) on+="■"; for(i=n;i<5;i++) off+="■";
    return '<span class="sev"><span class="b"><span class="on">'+on+'</span><span class="off">'+off+'</span></span>vaara '+n+' / 5</span>';
  }
  function approved(){ return DB.items.filter(function(x){ return x.status==="hyvaksytty"; }); }
  function pending(){ return DB.items.filter(function(x){ return x.status==="odottaa"; }); }
  function byId(id){ var a=DB.items.filter(function(x){ return x.id===id; }); return a.length?a[0]:null; }

  // ================= SELAA =================
  function viewBrowse(){
    var list=approved();
    var s='<p class="lead">Lue aineen kortti ennen käyttöä: vaarat, suojaimet, säilytyspaikka ja käyttöpaikka. Virallinen käyttöturvallisuustiedote avautuu linkistä.</p>';
    if(openId){ var it=byId(openId); if(it) return s+detailHTML(it)+'<div class="btnrow"><button class="btn ghost" id="closeD">Takaisin listaan</button></div>'; }

    var stale=0,i; for(i=0;i<list.length;i++){ var y=yearsSince(list[i].sdsDate); if(y!=null&&y>3) stale++; }
    s+='<div class="kpis">'
      + '<div class="kpi"><div class="k">Kemikaaleja</div><div class="v">'+list.length+'</div></div>'
      + '<div class="kpi"><div class="k">Odottaa hyväksyntää</div><div class="v" style="color:'+(pending().length?"var(--ember)":"var(--ink)")+'">'+pending().length+'</div></div>'
      + '<div class="kpi"><div class="k">KTT yli 3 v vanha</div><div class="v" style="color:'+(stale?"var(--laatu)":"var(--ink)")+'">'+stale+'</div></div>'
      + '<div class="kpi"><div class="k">ASA-seuranta</div><div class="v">'+list.filter(function(x){ return x.asa; }).length+'</div></div></div>';

    var ao='<option value="">Kaikki tilat</option>';
    for(i=0;i<AREAS.length;i++){ ao+='<option value="'+esc(AREAS[i])+'"'+(areaFilter===AREAS[i]?" selected":"")+'>'+esc(AREAS[i])+'</option>'; }
    s+='<div class="panel"><div class="inline">'
      + '<div class="field"><label>Hae</label><input type="text" id="fq" value="'+esc(q)+'" placeholder="Kauppanimi tai toimittaja"></div>'
      + '<div class="field"><label>Käyttöpaikka</label><select id="fa">'+ao+'</select></div>'
      + '<button class="btn ghost" id="fclear">Tyhjennä</button></div></div>';

    var ql=q.toLowerCase();
    var vis=list.filter(function(x){
      if(areaFilter && String(x.useLoc).indexOf(areaFilter)===-1) return false;
      if(!ql) return true;
      return (x.name+" "+x.supplier).toLowerCase().indexOf(ql)!==-1;
    });
    if(vis.length===0) return s+'<div class="panel"><p class="lead" style="margin:0;">Ei osumia. '+(STAFF?"Syötä aineita PRO24-välilehdeltä.":"Jos tarvitsemasi aine puuttuu, tee ehdotus.")+'</p></div>';

    s+='<div class="clist">';
    for(i=0;i<vis.length;i++){ var c=vis[i];
      s+='<div class="ccard h'+(c.sev||1)+'" data-open="'+c.id+'"><h4>'+esc(c.name)+'</h4>'
        + '<div class="sup">'+esc(c.supplier||"—")+'</div>'
        + (c.asa?'<span class="pill p-asa">ASA</span>':'')
        + sevBlocks(c.sev)
        + '<div class="loc">Säilytys: '+esc(c.storeLoc||"—")+'<br>Käyttö: '+esc(c.useLoc||"—")+'</div></div>'; }
    return s+'</div>';
  }
  function detailHTML(it){
    var y=yearsSince(it.sdsDate);
    var s='<div class="detail"><span class="kicker">Kemikaalikortti</span><h3>'+esc(it.name)+'</h3>'
      + '<div class="mono" style="font-size:.62rem;color:var(--ink-soft);">'+esc(it.supplier||"toimittaja tuntematon")+'</div>'
      + '<div style="margin-top:.5em;">';
    var i;
    if(it.ghs){ var g=it.ghs.split(",");
      for(i=0;i<g.length;i++){ if(g[i].trim()) s+='<span class="pill p-ghs">'+esc(g[i].trim())+'</span>'; } }
    if(it.asa) s+='<span class="pill p-asa">ASA-rekisteri</span>';
    s+='</div>'+sevBlocks(it.sev);
    s+='<div class="drow"><span class="dl">Vaaralausekkeet</span><span>'+esc(it.h||"—")+'</span></div>'
      + '<div class="drow"><span class="dl">Suojaimet</span><span>'+(it.ppe?it.ppe.split(",").map(function(x){ return '<span class="pill p-ppe">'+esc(x.trim())+'</span>'; }).join(""):"—")+'</span></div>'
      + '<div class="drow"><span class="dl">Säilytys</span><span>'+esc(it.storeLoc||"—")+'</span></div>'
      + '<div class="drow"><span class="dl">Käyttöpaikka</span><span>'+esc(it.useLoc||"—")+'</span></div>'
      + '<div class="drow"><span class="dl">Käyttötarkoitus</span><span>'+esc(it.use||"—")+'</span></div>'
      + '<div class="drow"><span class="dl">Hävitys</span><span>'+esc(it.disposal||"—")+'</span></div>'
      + '<div class="drow"><span class="dl">KTT päivätty</span><span>'+fmtD(it.sdsDate)+'</span></div>'
      + '<div class="drow"><span class="dl">KTT</span><span>'+(it.sdsUrl?'<a href="'+esc(it.sdsUrl)+'" target="_blank" rel="noopener">Avaa käyttöturvallisuustiedote</a>':'<b>Puuttuu</b>')+'</span></div>';
    if(!it.sdsUrl) s+='<div class="warnbox">Tälle aineelle ei ole käyttöturvallisuustiedotetta rekisterissä. Ainetta ei saa käyttää ennen kuin KTT on saatavilla.</div>';
    else if(y!=null&&y>3) s+='<div class="warnbox">Käyttöturvallisuustiedote on yli kolme vuotta vanha — tarkista PRO24:stä, onko uudempi versio.</div>';
    else s+='<div class="okbox">Lue KTT ja käytä siinä vaadittuja suojaimia. Epäselvässä tilanteessa kysy pajamestarilta.</div>';
    if(it.proposedBy) s+='<div class="drow"><span class="dl">Ehdottaja</span><span>'+esc(it.proposedBy)+'</span></div>';
    if(it.decidedBy) s+='<div class="drow"><span class="dl">Hyväksyjä</span><span>'+esc(it.decidedBy)+' · '+fmt(it.decidedAt)+'</span></div>';
    if(it.syncedAt) s+='<div class="drow"><span class="dl">PRO24</span><span>Viety '+fmt(it.syncedAt)+' ('+esc(it.syncedHow||"")+')</span></div>';
    return s+'</div>';
  }
  function bindBrowse(){
    document.querySelectorAll("[data-open]").forEach(function(c){ c.addEventListener("click", function(){ openId=c.getAttribute("data-open"); render(); }); });
    var cd=document.getElementById("closeD"); if(cd){ cd.addEventListener("click", function(){ openId=""; render(); }); }
    var fq=document.getElementById("fq");
    if(fq){ fq.addEventListener("input", function(){ q=fq.value; var p=fq.selectionStart; render();
      var n=document.getElementById("fq"); if(n){ n.focus(); n.setSelectionRange(p,p); } }); }
    var fa=document.getElementById("fa"); if(fa){ fa.addEventListener("change", function(){ areaFilter=fa.value; render(); }); }
    var fc=document.getElementById("fclear"); if(fc){ fc.addEventListener("click", function(){ q=""; areaFilter=""; render(); }); }
  }

  // ================= PRO24-SYÖTTÖ =================
  function viewImport(){
    if(!STAFF) return '<div class="panel"><p class="lead" style="margin:0;">Tämä osio on henkilökunnalle. Avaa henkilökunnan tila Asetuksista.</p></div>';
    var ao="",po="",go="",i;
    for(i=0;i<AREAS.length;i++){ ao+='<option value="'+esc(AREAS[i])+'">'+esc(AREAS[i])+'</option>'; }
    for(i=0;i<PPE.length;i++){ po+='<option value="'+esc(PPE[i])+'">'+esc(PPE[i])+'</option>'; }
    for(i=0;i<GHS.length;i++){ go+='<option value="'+GHS[i].c+'">'+GHS[i].c+' · '+esc(GHS[i].t)+'</option>'; }
    return '<p class="lead">Syötä PRO24:n aineet joukolla liittämällä vienti alle, tai lisää yksittäinen aine lomakkeella.</p>'
      + '<div class="panel"><span class="kicker">Massasyöttö</span><h3>Liitä PRO24-vienti</h3>'
      + '<div class="msg info">Liitä taulukko, jossa ensimmäinen rivi on otsikot. Erottimena puolipiste tai sarkain. Tunnistetut sarakkeet: kauppanimi, toimittaja, h-lausekkeet, ghs, ktt-linkki, ktt-pvm, säilytys, käyttöpaikka, suojaimet, käyttötarkoitus, hävitys, vaara (1–5), asa.</div>'
      + '<div class="field"><label>Liitä tähän</label><textarea id="bulk" rows="7" placeholder="kauppanimi;toimittaja;h-lausekkeet;ktt-linkki;ktt-pvm;säilytys;käyttöpaikka;suojaimet"></textarea></div>'
      + '<div class="field" style="max-width:260px;"><label>Syöttäjä</label><input type="text" id="bulkBy" placeholder="Nimesi"></div>'
      + '<div id="mBulk"></div><div class="btnrow"><button class="btn primary" id="doBulk">Syötä rekisteriin</button></div></div>'

      + '<div class="panel"><span class="kicker">Yksittäinen</span><h3>Lisää aine</h3>'
      + '<div class="inline"><div class="field"><label>Kauppanimi</label><input type="text" id="aName"></div>'
      + '<div class="field"><label>Toimittaja</label><input type="text" id="aSup"></div></div>'
      + '<div class="inline"><div class="field"><label>KTT-linkki (PRO24)</label><input type="text" id="aUrl" placeholder="https://"></div>'
      + '<div class="field" style="max-width:170px;"><label>KTT päivätty</label><input type="date" id="aDate"></div></div>'

      if(qz.length===0){ out.innerHTML='<div class="msg info">Ei viemättömiä aineita.</div>'; return; }
      out.innerHTML='<div class="msg info">Lähetetään '+qz.length+' kemikaalia...</div>';
      var hdr={ "Content-Type":"application/json" };
      if(key) hdr["Authorization"]="Bearer "+key;
      fetch(url,{ method:"POST", headers:hdr, body:JSON.stringify(pro24Payload(qz)) })
        .then(function(r){
          if(r.ok){ markSynced(qz,by(),"rajapinta"); flash(qz.length+" kemikaalia lähetetty PRO24:ään rajapinnan kautta.","ok"); }
          else { out.innerHTML='<div class="msg err">Palvelin vastasi virheellä '+r.status+'. Tarkista osoite ja avain, tai käytä tiedostovientiä.</div>'; } })
        .catch(function(e){
          out.innerHTML='<div class="msg err">Yhteys ei onnistunut selaimesta (todennäköisesti CORS-rajoitus tai väärä osoite). Tämä on tavallista: lähetys kuuluu tuotannossa palvelimelle. Käytä toistaiseksi tiedostovientiä.</div>'; });
    }); }
  }

  // ================= LOKI & ASETUKSET =================
  function viewLog(){
    var s='<p class="lead">Kaikki syötöt, ehdotukset ja päätökset aikajärjestyksessä. Loki on vain lisäävä.</p>';
    var rej=DB.items.filter(function(x){ return x.status==="hylatty"; });
    if(rej.length>0){ s+='<div class="panel"><span class="kicker">Hylätyt</span><h3>Hylätyt ehdotukset</h3>';
      var i; for(i=0;i<rej.length;i++){ s+='<div class="drow"><span class="dl">'+esc(rej[i].name)+'</span><span>'+esc(rej[i].rejectReason||"—")+' · '+esc(rej[i].decidedBy||"")+'</span></div>'; }
      s+='</div>'; }
    if(DB.log.length===0) return s+'<div class="panel"><p class="lead" style="margin:0;">Loki on tyhjä.</p></div>';
    s+='<div class="panel">'; var j;
    for(j=DB.log.length-1;j>=0;j--){ var l=DB.log[j];
      s+='<div class="logline"><span class="ts">'+fmt(l.ts)+'</span><span class="pill p-'+(l.kind==="hyvaksytty"?"hyvaksytty":(l.kind==="hylatty"?"hylatty":"odottaa"))+'">'+esc(l.kind)+'</span>'
        + '<span style="flex:1;min-width:200px;"><b>'+esc(l.ref)+'</b> — '+esc(l.text)+'</span><span class="ts">'+esc(l.by)+'</span></div>'; }
    s+='</div><div class="btnrow"><button class="btn" id="expCsv">Vie rekisteri (CSV)</button><button class="btn ghost" id="expJson">Vie kaikki (JSON)</button></div>';
    return s;
  }
  function bindLog(){
    var a=document.getElementById("expCsv");
    if(a){ a.addEventListener("click", function(){
      var rows=["Kauppanimi;Toimittaja;H-lausekkeet;GHS;Suojaimet;Sailytys;Kayttopaikka;KTT-linkki;KTT-pvm;Vaara;ASA;Tila;Lahde"],i;
      for(i=0;i<DB.items.length;i++){ var c=DB.items[i];
        rows.push([cc(c.name),cc(c.supplier),cc(c.h),cc(c.ghs),cc(c.ppe),cc(c.storeLoc),cc(c.useLoc),cc(c.sdsUrl),cc(c.sdsDate),c.sev||"",c.asa?"kyllä":"",cc(c.status),cc(c.source)].join(";")); }
      download("\ufeff"+rows.join("\r\n"),"kemikaalirekisteri.csv","text/csv;charset=utf-8"); }); }
    var b=document.getElementById("expJson");
    if(b){ b.addEventListener("click", function(){ download(JSON.stringify(DB,null,2),"kemikaalirekisteri.json","application/json"); }); }
  }
  function viewSettings(){
    var s='<div class="panel"><span class="kicker">Käyttöoikeus</span><h3>Henkilökunnan tila</h3>';
    if(STAFF){ s+='<div class="msg ok">Henkilökunnan tila päällä: voit syöttää aineita ja käsitellä ehdotuksia.</div>'
      + '<div class="btnrow"><button class="btn" id="lock">Poistu</button></div>'
      + '<div class="field" style="margin-top:.7em;max-width:260px;"><label>Vaihda tunnusluku</label><input type="text" id="newPin" value="'+esc(DB.pin)+'"></div>'
      + '<div class="btnrow"><button class="btn ghost" id="savePin">Tallenna</button></div>'; }
    else { s+='<div class="inline"><div class="field" style="max-width:240px;"><label>Tunnusluku</label><input type="password" id="pinIn" placeholder="'+(DB.pin?"Syötä tunnusluku":"Ei asetettu — paina Avaa")+'"></div><button class="btn primary" id="unlock">Avaa</button></div>'; }
    s+='</div>';
    s+='<div class="panel"><span class="kicker">Demo</span><h3>Kokeile</h3><div class="btnrow"><button class="btn primary" id="demo">Lataa esimerkkiaineet</button></div></div>';
    if(STAFF) s+='<div class="panel"><span class="kicker">Vaarallinen</span><h3>Tyhjennä</h3><div class="btnrow"><button class="btn ghost" id="wipe">Tyhjennä rekisteri ja loki</button></div></div>';
    return s;
  }
  function bindSettings(){
    var u=document.getElementById("unlock");
    if(u){ u.addEventListener("click", function(){ var v=document.getElementById("pinIn").value;
      if(!DB.pin||v===DB.pin){ STAFF=true; render(); } else { flash("Väärä tunnusluku.","err"); } }); }
    var l=document.getElementById("lock"); if(l){ l.addEventListener("click", function(){ STAFF=false; render(); }); }
    var sp=document.getElementById("savePin"); if(sp){ sp.addEventListener("click", function(){ DB.pin=document.getElementById("newPin").value.trim(); save(); flash("Tallennettu.","ok"); }); }
    var d=document.getElementById("demo");
    if(d){ d.addEventListener("click", function(){
      if(!window.confirm("Ladataanko esimerkkiaineet nykyisten lisäksi?")) return;
      var ex=[
        { name:"Osmo Color TopOil", supplier:"Osmo", h:"H226", ghs:"GHS02", ppe:"Käsineet, Kohdepoisto", storeLoc:"Puustudion kemikaalikaappi", useLoc:"Puustudio", use:"Puun pintakäsittely, elintarvikekelpoinen", disposal:"Rätit metalliastiaan — itsesyttymisvaara", sev:3, sdsUrl:"https://pro24.example/ktt/topoil", sdsDate:"2025-04-12", asa:false },
        { name:"Asetoni", supplier:"Kiilto", h:"H225, H319, H336", ghs:"GHS02, GHS07", ppe:"Suojalasit, Käsineet, Kohdepoisto", storeLoc:"Maalaamon paloturvakaappi", useLoc:"Maalaamo esikäsittely", use:"Puhdistus ja rasvanpoisto", disposal:"Vaarallinen jäte — ei viemäriin", sev:4, sdsUrl:"https://pro24.example/ktt/asetoni", sdsDate:"2024-09-30", asa:false },
        { name:"Spraymaali RAL 9005", supplier:"Motip", h:"H222, H319", ghs:"GHS02, GHS07", ppe:"Hengityssuojain, Suojalasit, Kohdepoisto", storeLoc:"Maalaamon kaappi", useLoc:"Maalaamo", use:"Metallin maalaus", disposal:"Tyhjä tölkki vaarallinen jäte", sev:3, sdsUrl:"https://pro24.example/ktt/motip", sdsDate:"2021-02-01", asa:false },
        { name:"Ponal puuliima", supplier:"Henkel", h:"", ghs:"", ppe:"Käsineet", storeLoc:"Puustudion hylly", useLoc:"Puustudio", use:"Liimalevyt ja liitokset", disposal:"Kuivunut liima sekajäte", sev:1, sdsUrl:"https://pro24.example/ktt/ponal", sdsDate:"2025-01-15", asa:false }
      ],i;
      for(i=0;i<ex.length;i++){ var e=ex[i]; e.id=uid(); e.status="hyvaksytty"; e.source="PRO24"; e.decidedBy="Demo"; e.decidedAt=nowISO(); DB.items.push(e); }
      DB.items.push({ id:uid(), name:"Epoksihartsi X20", supplier:"Muoviala Oy", sdsUrl:"https://pro24.example/ktt/epoksi", sdsDate:"2026-03-04",
        useLoc:"Protostudio", why:"Tarvitsen valuun opinnäytetyön prototyypissä.", proposedBy:"Aino Virtanen (TXA26)", proposedAt:nowISO(),
        status:"odottaa", sev:3, h:"", ghs:"", ppe:"", storeLoc:"", use:"", disposal:"", asa:false, source:"ehdotus" });
      logAdd("syotto","PRO24","4 esimerkkiainetta ja 1 ehdotus ladattu","Demo");
      save(); current="selaa"; flash("Esimerkkiaineet ladattu.","ok"); }); }
    var w=document.getElementById("wipe");
    if(w){ w.addEventListener("click", function(){ if(window.confirm("Tyhjennetäänkö kaikki?")){ DB={items:[],log:[],pin:DB.pin}; save(); render(); } }); }
  }

  function cc(s){ return String(s==null?"":s).replace(/;/g," ").replace(/[\r\n]+/g," "); }
  function download(text,name,mime){
    try{ var b=new Blob([text],{type:mime}),u=URL.createObjectURL(b),a=document.createElement("a");
      a.href=u; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(u); },1000); }
    catch(e){ flash("Lataus ei onnistunut.","err"); }
  }

  // ================= ROUTER =================
  var TABS=[
    { id:"selaa",   label:"Kemikaalit", render:viewBrowse,  bind:bindBrowse },
    { id:"ehdota",  label:"Ehdota kemikaalia", render:viewPropose, bind:bindPropose },
    { id:"syota",   label:"Syötä PRO24", render:viewImport, bind:bindImport },
    { id:"hyvaksy", label:"Hyväksyntä", render:viewApprove, bind:bindApprove },
    { id:"pro24",   label:"PRO24-vienti", render:viewSync, bind:bindSync },
    { id:"loki",    label:"Loki & vienti", render:viewLog,  bind:bindLog },
    { id:"asetukset",label:"Asetukset", render:viewSettings, bind:bindSettings }
  ];
  function render(){
    var el=document.getElementById("tabs"),s="",i,pend=pending().length;
    for(i=0;i<TABS.length;i++){
      var extra=(TABS[i].id==="hyvaksy"&&pend>0)?'<span class="badge">'+pend+'</span>':"";
      s+='<button class="tab'+(TABS[i].id===current?" active":"")+'" data-tab="'+TABS[i].id+'">'+TABS[i].label+extra+'</button>'; }
    el.innerHTML=s;
    el.querySelectorAll("[data-tab]").forEach(function(b){ b.addEventListener("click", function(){ current=b.getAttribute("data-tab"); openId=""; flashMsg=null; render(); }); });
    var badge=document.getElementById("modeBadge");
    badge.className="modebadge "+(STAFF?"on":"off"); badge.textContent=STAFF?"Henkilökunnan tila":"Opiskelijan tila";
    var t=null; for(i=0;i<TABS.length;i++){ if(TABS[i].id===current) t=TABS[i]; }
    var html=t.render();
    if(flashMsg){ html='<div class="msg '+flashMsg.k+'">'+esc(flashMsg.t)+'</div>'+html; flashMsg=null; }
    document.getElementById("view").innerHTML=html;
    if(t.bind) t.bind();
    document.getElementById("note").innerHTML=
      "Kemikaalivastuu on työnantajalla (VNa 715/2001, TTL 738/2002): ainetta ei saa käyttää ilman varoitusmerkintöjä ja käyttöturvallisuustiedotetta. "
      + "PRO24 on virallinen rekisteri — tämä työkalu linkittää siihen ja tuo tiedon pajalle, ei korvaa sitä. "
      + "Pilotti: tiedot vain tässä selaimessa, ota varmuuskopio Loki-välilehdeltä.";
  }

  load(); render();
})();
</script>
<script src="paja-footer.js"></script>
</body>
