<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Muotoilun pajat — sisäänkäynti</title>
<meta name="theme-color" content="#CE3F1B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pajat">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="mhks-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ECE6DA;--paper-deep:#E4DCCC;--card:#F3EFE7;--ink:#211C16;--ink-soft:#5A5347;
    --ember:#CE3F1B;--rule:#C8BFAD;--rule-soft:#D8D0C0;--steel:#3D4B58;

    /* pastellit */
    --pa-ember:#F6DCD2;  --pa-ember-d:#E8BCAB;
    --pa-sage:#DCE8DA;   --pa-sage-d:#BFD3BC;
    --pa-sky:#D9E4EF;    --pa-sky-d:#B9CCDE;
    --pa-sand:#F2E6C9;   --pa-sand-d:#E0CFA4;
    --pa-lilac:#E4DEEF;  --pa-lilac-d:#C8BEDD;
    --pa-mint:#D6E8E5;   --pa-mint-d:#B4D4CF;
    --pa-clay:#EFDFD3;   --pa-clay-d:#DBC3B0;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;color:var(--ink);font-family:"Spectral",Georgia,serif;font-size:16px;line-height:1.55;
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(206,63,27,.10), transparent 60%),
      radial-gradient(800px 460px at 92% 6%, rgba(78,140,132,.12), transparent 62%),
      var(--paper);
    -webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:"Big Shoulders Display",Arial,sans-serif;font-weight:800;text-transform:uppercase;line-height:.95;margin:0;}
  .mono{font-family:"IBM Plex Mono",monospace;}
  p{margin:0 0 1em;}
  .wrap{max-width:1060px;margin:0 auto;padding:0 clamp(14px,4vw,30px) 70px;}

  /* ---------- SISÄÄNKÄYNTI ---------- */
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 18px;}
  .gatebox{width:100%;max-width:520px;text-align:center;}
  .crest{width:96px;height:96px;margin:0 auto 14px;border-radius:24px;background:linear-gradient(160deg,#CE3F1B,#A83314);
    display:grid;place-items:center;box-shadow:0 14px 30px rgba(33,28,22,.22), inset 0 2px 0 rgba(255,255,255,.35);}
  .crest svg{width:56px;height:56px;}
  .gatebox h1{font-size:clamp(2rem,7vw,3rem);}
  .gatebox h1 .e{color:var(--ember);}
  .gatesub{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:22px;}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:22px;padding:20px 22px;text-align:left;
    box-shadow:0 18px 40px rgba(33,28,22,.12), inset 0 1px 0 rgba(255,255,255,.6);}
  .card h3{font-size:1.2rem;margin-bottom:.5em;}
  .field{margin:.7em 0;}
  .field label{display:block;font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.25em;}
  .field input,.field select{width:100%;font-family:"Spectral",serif;font-size:1rem;padding:.6em .7em;border:1px solid var(--rule);border-radius:12px;background:#fff;color:var(--ink);}
  .field input:focus,.field select:focus{outline:2px solid var(--ember);border-color:var(--ember);}
  .rolepick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:.5em 0 0;}
  @media (max-width:460px){.rolepick{grid-template-columns:1fr;}}
  .rp{border:1px solid var(--rule);border-radius:14px;padding:.6em .7em;cursor:pointer;background:#fff;text-align:left;font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);}
  .rp:hover{border-color:var(--ink-soft);color:var(--ink);}
  .rp.sel{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .btn{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:.65em 1.1em;border-radius:12px;}
  .btn:hover{background:var(--ink);color:var(--paper);}
  .btn.primary{background:var(--ember);border-color:var(--ember);color:#fff;box-shadow:0 8px 18px rgba(206,63,27,.28);}
  .btn.primary:hover{background:#b0340f;}
  .btn.ghost{border-color:var(--rule);color:var(--ink-soft);}
  .btn.mini{font-size:.58rem;padding:.45em .7em;}
  .btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .msg{font-size:.86rem;padding:.55em .75em;border-radius:10px;margin-top:.6em;}
  .msg.err{background:rgba(206,63,27,.1);border-left:3px solid var(--ember);color:#8f2a10;}
  .gatenote{font-family:"IBM Plex Mono",monospace;font-size:.6rem;color:var(--ink-soft);line-height:1.7;margin-top:16px;}

  /* ---------- SISÄTASO ---------- */
  .top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:clamp(20px,4vw,34px) 0 6px;}
  .hi h2{font-size:clamp(1.7rem,5vw,2.6rem);}
  .hi h2 .e{color:var(--ember);}
  .hi .r{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-top:.25em;}
  .secline{display:flex;align-items:center;gap:10px;margin:26px 0 12px;}
  .secline h3{font-size:1.15rem;white-space:nowrap;}
  .secline .ln{flex:1;height:1px;background:var(--rule);}

  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px;}
  .tile{position:relative;display:block;text-decoration:none;color:inherit;border-radius:20px;padding:15px 15px 16px;border:1px solid rgba(33,28,22,.10);
    box-shadow:0 10px 18px rgba(33,28,22,.13), 0 2px 4px rgba(33,28,22,.08), inset 0 2px 0 rgba(255,255,255,.75), inset 0 -3px 0 rgba(33,28,22,.06);
    transition:transform .18s ease, box-shadow .18s ease;}
  .tile .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-family:"Big Shoulders Display",Arial,sans-serif;font-weight:800;font-size:20px;color:#fff;
    box-shadow:0 5px 10px rgba(33,28,22,.18), inset 0 1px 0 rgba(255,255,255,.4);margin-bottom:9px;}
  .tile h4{font-size:1.1rem;line-height:1;margin-bottom:.25em;}
  .tile .d{font-size:.83rem;color:var(--ink-soft);line-height:1.35;}
  .tile:hover{transform:translateY(-5px);box-shadow:0 18px 28px rgba(33,28,22,.18), 0 3px 6px rgba(33,28,22,.10), inset 0 2px 0 rgba(255,255,255,.8), inset 0 -3px 0 rgba(33,28,22,.06);animation:wob .62s ease-in-out;}
  .tile:focus-visible{outline:3px solid var(--ember);outline-offset:3px;}
  @keyframes wob{
    0%{transform:translateY(-5px) rotate(0deg);}
    20%{transform:translateY(-5px) rotate(-1.6deg);}
    40%{transform:translateY(-5px) rotate(1.4deg);}
    60%{transform:translateY(-5px) rotate(-.9deg);}
    80%{transform:translateY(-5px) rotate(.5deg);}
    100%{transform:translateY(-5px) rotate(0deg);}
  }
  .t-ember{background:linear-gradient(165deg,var(--pa-ember),var(--pa-ember-d));} .t-ember .ic{background:#CE3F1B;}
  .t-sage{background:linear-gradient(165deg,var(--pa-sage),var(--pa-sage-d));}    .t-sage .ic{background:#5E8C5A;}
  .t-sky{background:linear-gradient(165deg,var(--pa-sky),var(--pa-sky-d));}       .t-sky .ic{background:#4F6E92;}
  .t-sand{background:linear-gradient(165deg,var(--pa-sand),var(--pa-sand-d));}    .t-sand .ic{background:#BE8A2E;}
  .t-lilac{background:linear-gradient(165deg,var(--pa-lilac),var(--pa-lilac-d));} .t-lilac .ic{background:#6E5A93;}
  .t-mint{background:linear-gradient(165deg,var(--pa-mint),var(--pa-mint-d));}    .t-mint .ic{background:#4E8C84;}
  .t-clay{background:linear-gradient(165deg,var(--pa-clay),var(--pa-clay-d));}    .t-clay .ic{background:#B0712F;}
  .t-steel{background:linear-gradient(165deg,#DFE4E8,#C3CCD3);}                   .t-steel .ic{background:#3D4B58;}

  .foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--rule);font-family:"IBM Plex Mono",monospace;font-size:.62rem;color:var(--ink-soft);line-height:1.8;}

  /* ---------- ESITTELY ---------- */
  .ov{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:18px;
    background:rgba(33,28,22,.62);backdrop-filter:blur(3px);}
  .ovbox{width:100%;max-width:560px;background:var(--card);border-radius:24px;padding:24px 24px 18px;
    box-shadow:0 26px 60px rgba(33,28,22,.35), inset 0 1px 0 rgba(255,255,255,.7);position:relative;}
  .ovnum{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ember);font-weight:600;}
  .ovbox h3{font-size:clamp(1.5rem,5vw,2.1rem);margin:.3em 0 .4em;}
  .ovbox p{font-size:.97rem;margin:0 0 .8em;}
  .ovbox .vis{background:var(--paper-deep);border-radius:14px;padding:14px;margin:.6em 0 1em;}
  .ovflow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .ovstep{background:#fff;border:1px solid var(--rule);border-radius:20px;padding:.35em .7em;
    font-family:"IBM Plex Mono",monospace;font-size:.58rem;letter-spacing:.04em;text-transform:uppercase;}
  .ovstep.on{background:var(--ember);color:#fff;border-color:var(--ember);}
  .ovarr{color:var(--rule);font-weight:700;}
  .ovtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;}
  .ovt{border-radius:12px;padding:9px 10px;font-size:.8rem;line-height:1.3;
    box-shadow:0 4px 8px rgba(33,28,22,.10), inset 0 1px 0 rgba(255,255,255,.7);}
  .ovt b{display:block;font-family:"Big Shoulders Display",Arial,sans-serif;font-weight:800;text-transform:uppercase;font-size:.95rem;}
  .ovdots{display:flex;gap:5px;justify-content:center;margin:.4em 0 .9em;}
  .ovdot{width:7px;height:7px;border-radius:50%;background:var(--rule);}
  .ovdot.on{background:var(--ember);width:18px;border-radius:20px;}
  .ovbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;}
  .ovskip{background:transparent;border:none;color:var(--ink-soft);cursor:pointer;
    font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;padding:.5em 0;}
  .ovskip:hover{color:var(--ink);text-decoration:underline;}
  .ovnav{display:flex;gap:8px;}

  @media (prefers-reduced-motion:reduce){
    .tile{transition:none;}
    .tile:hover{animation:none;transform:none;}
    .ov{backdrop-filter:none;}
  }
</style>
</head>
<body>
<script src="paja-data.js"></script>
<script>
/* Varmistus: jos jaettu tietolähde ei latatunut, kerro se näkyvästi.
   Hiljainen tyhjä lista on turvallisuustyökalussa vaarallinen. */
(function(){
  if(window.PAJA) return;
  document.addEventListener("DOMContentLoaded", function(){
    var d=document.createElement("div");
    d.setAttribute("role","alert");
    d.style.cssText="position:sticky;top:0;z-index:9999;background:#CE3F1B;color:#fff;padding:12px 16px;"
      + "font-family:'IBM Plex Mono',monospace;font-size:.78rem;line-height:1.6;";
    d.innerHTML="<b>Tietolähde puuttuu.</b> Tiedosto paja-data.js ei latautunut, joten koneet, tilat ja "
      + "suojaimet eivät näy. Varmista että kaikki tiedostot ovat samassa kansiossa. "
      + "Älä käytä tätä sivua ohjeena ennen kuin tieto näkyy.";
    document.body.insertBefore(d, document.body.firstChild);
  });
})();
</script>

<div id="app"></div>

<script>
(function(){
  "use strict";
  var KEY="paja_portaali_v1";
  var S={ role:null, name:"" };
  var pick="opiskelija";
  var err="";

  function load(){ try{ var s=localStorage.getItem(KEY); if(s){ var d=JSON.parse(s); S.role=d.role||null; S.name=d.name||""; } }catch(e){} }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function firstName(n){ var p=String(n).trim().split(/\s+/); return p[0]||""; }
  function greet(){ var h=new Date().getHours();
    if(h<5) return "Hyvää yötä"; if(h<10) return "Huomenta"; if(h<17) return "Päivää"; return "Iltaa"; }

  var ROLES=(window.PAJA?PAJA.roles().filter(function(r){
    return ["opiskelija","lehtori","pajamestari","esimies"].indexOf(r.id)>-1;
  }).map(function(r){ return { id:r.id, label:r.name }; }):[]);
  function roleLabel(id){ var a=ROLES.filter(function(r){ return r.id===id; }); return a.length?a[0].label:id; }

  // työkalut: sections -> tiles
  var T={
    kurssi:{ href:"syksyn_orientaatiokurssi.html", ic:"O", c:"t-ember", h:"Orientaatiokurssi", d:"Ohjelma, turvallisuus ja paja-ajokortti" },
    app:{ href:"paja_app.html", ic:"P", c:"t-sage", h:"Paja-app", d:"Koneiden ohjeet, jätteet, siivous, varaus" },
    kone:{ href:"paja_konerekisteri.html", ic:"K", c:"t-steel", h:"Konerekisteri", d:"Koneet, ohjeet, sijainnit ja pajaälyn tietopohja" },
    kemia:{ href:"paja_kemikaalit.html", ic:"K", c:"t-clay", h:"Kemikaalit", d:"Kortit, KTT ja säilytyspaikat" },
    herate:{ href:"paja_herateloki.html", ic:"!", c:"t-sand", h:"Herätteet", d:"Poikkeamat ja läheltä piti — kirjaa havainto" },
    mhks:{ href:"mhks_app.html", ic:"M", c:"t-mint", h:"MHKS", d:"Materiaalikortti, hinnat ja toimittajat" },
    seuranta:{ href:"paja_seuranta.html", ic:"S", c:"t-sky", h:"Seuranta", d:"Ryhmä, läsnäolo, tehtävät ja arviointi" },
    peli:{ href:"pajapeli_digital_twin.html", ic:"L", c:"t-lilac", h:"Pajapeli", d:"Lauta, nappulat ja sääntökortit" },
    sivukartta:{ href:"kartta.html", ic:"?", c:"t-sand", h:"Sivustokartta", d:"Missä mikäkin on ja mistä se avataan" },
    asenna:{ href:"asenna.html", ic:"\u2193", c:"t-ember", h:"Asenna puhelimeen", d:"Sovellus kotinäytölle — ohjeet ja asennus" },
    kartta:{ href:"pajakuutio_hallinnan_kartta.html", ic:"H", c:"t-steel", h:"Hallinnan kartta", d:"Kentän filosofia ja periaatteet" },
    kuutio:{ href:"pajakuutio_esikatselu.html", ic:"6", c:"t-steel", h:"Pajakuutio", d:"Kuusi tahkoa ja niiden suhteet" },
    perusta:{ href:"pajatoiminnan_perusta.html", ic:"F", c:"t-steel", h:"Perusta", d:"Lainmukainen ja kaikille reilu pohja" },
    tyolupa:{ href:"turvallisuus_ja_tyolupa.html", ic:"T", c:"t-ember", h:"Työlupa", d:"Havaitse → Ymmärrä → Toimi" }
  };

  var LAYOUT={
    opiskelija:[
      { s:"Päivittäin", t:["kurssi","app","mhks"] },
      { s:"Turvallisuus", t:["kemia","herate","tyolupa","kone"] },
      { s:"Ymmärrys", t:["sivukartta","asenna","peli"] }
    ],
    lehtori:[
      { s:"Päivittäin", t:["seuranta","kurssi","app","sivukartta","asenna"] },
      { s:"Turvallisuus", t:["kemia","herate","kone"] },
      { s:"Hallinta", t:["mhks"] },
      { s:"Ymmärrys", t:["peli"] }
    ],
    pajamestari:[
      { s:"Päivittäin", t:["app","kone","herate","mhks","sivukartta","asenna"] },
      { s:"Turvallisuus", t:["kemia","tyolupa"] },
      { s:"Hallinta", t:["seuranta"] },
      { s:"Ymmärrys", t:["peli","kuutio"] }
    ],
    esimies:[
      { s:"Tilannekuva", t:["seuranta","mhks","herate","sivukartta","asenna"] },
      { s:"Turvallisuus", t:["kemia"] },
      { s:"Ymmärrys", t:["kartta","perusta"] }
    ]
  };

  function crestSVG(){
    return '<svg viewBox="0 0 64 64" aria-hidden="true">'
      + '<rect x="8" y="10" width="21" height="21" rx="4" fill="#F0E1C0"/>'
      + '<rect x="35" y="10" width="21" height="21" rx="4" fill="#F0E1C0" opacity="0.55"/>'
      + '<rect x="8" y="35" width="21" height="21" rx="4" fill="#F0E1C0" opacity="0.55"/>'
      + '<rect x="35" y="35" width="21" height="21" rx="4" fill="#F0E1C0"/></svg>';
  }

  // ---------- SISÄÄNKÄYNTI ----------
  function viewGate(){
    var r="",i;
    for(i=0;i<ROLES.length;i++){ r+='<button class="rp'+(pick===ROLES[i].id?" sel":"")+'" data-rp="'+ROLES[i].id+'">'+esc(ROLES[i].label)+'</button>'; }
    return '<div class="gate"><div class="gatebox">'
      + '<div class="crest">'+crestSVG()+'</div>'
      + '<h1>Muotoilun <span class="e">pajat</span></h1>'
      + '<div class="gatesub">Metropolia · Arabian kampus</div>'
      + '<div class="card"><h3>Tunnistaudu</h3>'
      + '<p style="font-size:.9rem;color:var(--ink-soft);margin:0 0 .6em;">Valitse roolisi, niin näet omat työkalusi.</p>'
      + '<div class="field"><label>Nimi</label><input type="text" id="gName" value="'+esc(S.name)+'" placeholder="Etunimi Sukunimi" autocomplete="name"></div>'
      + '<div class="field"><label>Rooli</label><div class="rolepick">'+r+'</div></div>'
      + (err?'<div class="msg err">'+esc(err)+'</div>':"")
      + '<div class="btnrow"><button class="btn primary" id="goIn">Kirjaudu sisään</button>'
      + '<button class="btn ghost" id="ovOpen">Katso esittely</button>'
      + '<a class="btn ghost" href="asenna.html" style="text-decoration:none;display:inline-block;">Asenna puhelimeen</a></div>'
      + '</div>'
      + '<p class="gatenote">Demo-tunnistautuminen: rooli valitaan tässä. Tuotannossa kirjautuminen tapahtuu Metropolian tunnuksilla (Haka / Moodle), jolloin nimi ja rooli tulevat automaattisesti eikä niitä kirjoiteta käsin.</p>'
      + '</div></div>';
  }
  function bindGate(){
    document.querySelectorAll("[data-rp]").forEach(function(b){ b.addEventListener("click", function(){ pick=b.getAttribute("data-rp"); err=""; render(); }); });
    var g=document.getElementById("goIn");
    if(g){ g.addEventListener("click", function(){
      var n=document.getElementById("gName").value.trim();
      if(n.length<2){ err="Kirjoita nimesi jatkaaksesi."; render(); return; }
      S.name=n; S.role=pick; err=""; save(); render(); }); }
    var inp=document.getElementById("gName");
    if(inp){ inp.addEventListener("keydown", function(e){ if(e.key==="Enter"){ document.getElementById("goIn").click(); } }); }
    var ob=document.getElementById("ovOpen"); if(ob){ ob.addEventListener("click", openIntro); }
  }

  // ---------- SISÄTASO ----------
  function tileHTML(key){
    var t=T[key]; if(!t) return "";
    return '<a class="tile '+t.c+'" href="'+t.href+'"><span class="ic">'+esc(t.ic)+'</span>'
      + '<h4>'+esc(t.h)+'</h4><div class="d">'+esc(t.d)+'</div></a>';
  }
  function viewHome(){
    var lay=LAYOUT[S.role]||LAYOUT.opiskelija;
    var s='<div class="wrap"><div class="top">'
      + '<div class="hi"><h2>'+esc(greet())+', <span class="e">'+esc(firstName(S.name))+'</span></h2>'
      + '<div class="r">'+esc(roleLabel(S.role))+' · Muotoilun pajat</div></div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;">'
      + '<button class="btn ghost mini" id="ovOpen2">Esittely</button>'
      + '<button class="btn ghost mini" id="inst" style="display:none;">Asenna sovellus</button>'
      + '<button class="btn ghost mini" id="out">Vaihda rooli</button></div></div>';
    var i,j;
    for(i=0;i<lay.length;i++){
      s+='<div class="secline"><h3>'+esc(lay[i].s)+'</h3><span class="ln"></span></div><div class="tiles">';
      for(j=0;j<lay[i].t.length;j++){ s+=tileHTML(lay[i].t[j]); }
      s+='</div>';
    }
    s+='<div class="foot">Pidä kaikki tiedostot samassa kansiossa, niin laatat aukeavat.<br>'
      + 'Pilotti: tiedot tallentuvat selaimeen. Henkilötiedot kuuluvat Metropolian omiin järjestelmiin — katso tietosuojadokumentaatio.</div></div>';
    return s;
  }
  function bindHome(){
    var o=document.getElementById("out");
    if(o){ o.addEventListener("click", function(){ S.role=null; save(); render(); }); }
    var ob2=document.getElementById("ovOpen2"); if(ob2){ ob2.addEventListener("click", openIntro); }
  }

  function render(){
    var app=document.getElementById("app");
    if(!S.role){ app.innerHTML=viewGate(); bindGate();
      var n=document.getElementById("gName"); if(n && !S.name) n.focus(); }
    else { app.innerHTML=viewHome(); bindHome(); showInstall(); }
  }

  // ---------- ESITTELY ----------
  var INTRO_KEY="paja_esittely_nahty_v1";
  var slide=0;
  var SLIDES=[
    { n:"1 / 5", h:"Tervetuloa", p:"Tämä on Muotoilun pajojen työkalukokonaisuus. Se tekee pajan toiminnasta läpinäkyvää ja oikean tiedon saavutettavaa, jotta opiskelija oppii turvallisesti ja itsenäisesti.",
      vis:'<div class="ovflow"><span class="ovstep on">Turvallisuus</span><span class="ovarr">+</span><span class="ovstep on">Osaaminen</span><span class="ovarr">+</span><span class="ovstep on">Läpinäkyvyys</span></div>' },
    { n:"2 / 5", h:"Polku pajalle", p:"Kaikki alkaa perehdytyksestä. Työlupa allekirjoitetaan, paja-ajokortti suoritetaan konekohtaisesti — ja vasta se avaa valvotun itsenäisen työskentelyn.",
      vis:'<div class="ovflow"><span class="ovstep on">Perehdytys</span><span class="ovarr">&rarr;</span><span class="ovstep on">Työlupa</span><span class="ovarr">&rarr;</span><span class="ovstep on">Ajokortti</span><span class="ovarr">&rarr;</span><span class="ovstep">Itsenäinen työ</span></div>' },
    { n:"3 / 5", h:"Päivittäinen työ", p:"Pajalla mukana kulkevat työkalut. Nämä toimivat myös puhelimessa: koneiden ohjeet, kemikaalikortit ja poikkeamailmoitukset.",
      vis:'<div class="ovtiles"><span class="ovt" style="background:#DCE8DA"><b>Paja-app</b>Koneet, jätteet, siivous</span><span class="ovt" style="background:#EFDFD3"><b>Kemikaalit</b>Kortit ja KTT</span><span class="ovt" style="background:#F2E6C9"><b>Herätteet</b>Poikkeamat ja loki</span></div>' },
    { n:"4 / 5", h:"Hallinta ja seuranta", p:"MHKS näyttää materiaalin todellisen hinnan ja toimittajan. Seuranta kokoaa ryhmän, läsnäolon, tehtävät ja arvioinnin yhteen näkymään.",
      vis:'<div class="ovtiles"><span class="ovt" style="background:#D6E8E5"><b>MHKS</b>Materiaalikortti ja hinnat</span><span class="ovt" style="background:#D9E4EF"><b>Seuranta</b>Ryhmä ja arviointi</span></div>' },
    { n:"5 / 5", h:"Hyvä tietää", p:"Eksytkö? Sivustokartta kertoo mitä missäkin on. Tietosuojalinkki on jokaisen sivun alalaidassa. Ja tärkein: tämä on pilotti — tiedot tallentuvat selaimeen, joten älä syötä oikeita nimiä tai opiskelijanumeroita.",
      vis:'<div class="ovtiles"><span class="ovt" style="background:#F2E6C9"><b>Kartta</b>Mitä missäkin on</span><span class="ovt" style="background:#F6DCD2"><b>Pilotti</b>Käytä keksittyjä nimiä</span></div>' }
  ];
  function introSeen(){ try{ return localStorage.getItem(INTRO_KEY)==="1"; }catch(e){ return false; } }
  function markSeen(){ try{ localStorage.setItem(INTRO_KEY,"1"); }catch(e){} }
  function closeIntro(){ var o=document.getElementById("ovl"); if(o){ o.parentNode.removeChild(o); } markSeen();
    document.removeEventListener("keydown", introKeys); }
  function introKeys(e){
    if(e.key==="Escape"){ closeIntro(); }
    else if(e.key==="ArrowRight"){ if(slide<SLIDES.length-1){ slide++; drawIntro(); } else { closeIntro(); } }
    else if(e.key==="ArrowLeft"){ if(slide>0){ slide--; drawIntro(); } }
  }
  function drawIntro(){
    var o=document.getElementById("ovl"); if(!o) return;
    var s=SLIDES[slide], d="", i;
    for(i=0;i<SLIDES.length;i++){ d+='<span class="ovdot'+(i===slide?" on":"")+'"></span>'; }
    o.innerHTML='<div class="ovbox" role="dialog" aria-modal="true" aria-label="Esittely">'
      + '<span class="ovnum">'+esc(s.n)+'</span><h3>'+esc(s.h)+'</h3><p>'+esc(s.p)+'</p>'
      + '<div class="vis">'+s.vis+'</div><div class="ovdots">'+d+'</div>'
      + '<div class="ovbtns"><button class="ovskip" id="ovSkip">Ohita esittely</button><div class="ovnav">'
      + (slide>0?'<button class="btn ghost" id="ovPrev">Edellinen</button>':'')
      + '<button class="btn primary" id="ovNext">'+(slide<SLIDES.length-1?"Seuraava":"Aloita")+'</button>'
      + '</div></div></div>';
    document.getElementById("ovSkip").addEventListener("click", closeIntro);
    document.getElementById("ovNext").addEventListener("click", function(){
      if(slide<SLIDES.length-1){ slide++; drawIntro(); } else { closeIntro(); } });
    var pv=document.getElementById("ovPrev");
    if(pv){ pv.addEventListener("click", function(){ if(slide>0){ slide--; drawIntro(); } }); }
  }
  function openIntro(){
    if(document.getElementById("ovl")) return;
    slide=0;
    var o=document.createElement("div"); o.className="ov"; o.id="ovl";
    document.body.appendChild(o);
    document.addEventListener("keydown", introKeys);
    drawIntro();
  }

  // PWA
  var deferred=null;
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferred=e; showInstall(); });
  function showInstall(){
    var b=document.getElementById("inst"); if(!b||!deferred) return;
    b.style.display="inline-block";
    b.onclick=function(){ deferred.prompt(); deferred=null; b.style.display="none"; };
  }
  if("serviceWorker" in navigator && location.protocol==="https:"){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }

  load(); if(S.role) pick=S.role; render();
  if(!introSeen()){ openIntro(); }
})();
</script>
<script src="paja-footer.js"></script>
</body>
</html>
