<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konerekisteri ja pajaälyn tietopohja — Muotoilun pajat</title>
<meta name="theme-color" content="#CE3F1B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="mhks-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#ECE6DA;--paper-deep:#E4DCCC;--card:#F3EFE7;--ink:#211C16;--ink-soft:#5A5347;
    --ember:#CE3F1B;--rule:#C8BFAD;--rule-soft:#D8D0C0;--vihrea:#5E8C5A;--laatu:#BE8A2E;--steel:#3D4B58;--oikeus:#4F6E92;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Spectral",Georgia,serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1060px;margin:0 auto;padding:0 clamp(12px,3vw,26px) 60px;}
  h1,h2,h3,h4,h5{font-family:"Big Shoulders Display",Arial,sans-serif;font-weight:800;text-transform:uppercase;line-height:.95;margin:0;}
  .mono{font-family:"IBM Plex Mono",monospace;}
  p{margin:0 0 1em;}
  .head{padding:clamp(20px,4vw,34px) 0 10px;}
  .head h1{font-size:clamp(1.8rem,5vw,2.9rem);}
  .head h1 .e{color:var(--ember);}
  .head p{color:var(--ink-soft);font-size:.93rem;max-width:70ch;margin:.4em 0 0;}

  .tabs{position:sticky;top:64px;z-index:20;background:var(--paper);display:flex;gap:4px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--rule);}
  .tab{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;cursor:pointer;border:1px solid var(--rule);background:var(--card);color:var(--ink-soft);padding:.55em .8em;border-radius:20px;flex:none;}
  .tab:hover{border-color:var(--ink-soft);color:var(--ink);}
  .tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .tab .n{background:var(--ember);color:#fff;border-radius:20px;padding:0 .4em;margin-left:.3em;font-size:.9em;}

  .view{padding-top:16px;}
  .lead{color:var(--ink-soft);font-size:.92rem;max-width:74ch;margin:0 0 14px;}
  .panel{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:13px 15px;margin-bottom:13px;}
  .panel h3{font-size:1.15rem;margin-bottom:.4em;}
  .kicker{font-family:"IBM Plex Mono",monospace;font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ember);font-weight:600;display:block;margin-bottom:.2em;}

  .btn{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:.5em .82em;border-radius:3px;}
  .btn:hover{background:var(--ink);color:var(--paper);}
  .btn.primary{background:var(--ember);border-color:var(--ember);color:#fff;}
  .btn.primary:hover{background:#b0340f;}
  .btn.ok{background:var(--vihrea);border-color:var(--vihrea);color:#fff;}
  .btn.ghost{border-color:var(--rule);color:var(--ink-soft);}
  .btn.mini{font-size:.54rem;padding:.3em .55em;}
  .btnrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}

  .field{margin:.45em 0;}
  .field label{display:block;font-family:"IBM Plex Mono",monospace;font-size:.56rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.2em;}
  .field input,.field select,.field textarea{width:100%;font-family:"Spectral",serif;font-size:.94rem;padding:.45em .55em;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink);}
  .field textarea{resize:vertical;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--ember);border-color:var(--ember);}
  .inline{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;}
  .inline .field{flex:1;min-width:140px;margin:0;}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:9px;margin-bottom:13px;}
  .kpi{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:11px 13px;}
  .kpi .k{font-family:"IBM Plex Mono",monospace;font-size:.54rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);}
  .kpi .v{font-family:"Big Shoulders Display",Arial,sans-serif;font-weight:800;font-size:1.9rem;line-height:1;margin-top:.1em;}

  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
  .mcard{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--steel);border-radius:8px;padding:12px 13px;cursor:pointer;}
  .mcard:hover{border-color:var(--ink-soft);}
  .mcard.h4,.mcard.h5{border-left-color:var(--ember);}
  .mcard.h3{border-left-color:var(--laatu);}
  .mcard.h1,.mcard.h2{border-left-color:var(--vihrea);}
  .mcard h4{font-size:1.05rem;line-height:1.05;}
  .mcard .rm{font-family:"IBM Plex Mono",monospace;font-size:.56rem;color:var(--ink-soft);margin-top:.15em;}
  .mcard .loc{font-family:"IBM Plex Mono",monospace;font-size:.58rem;color:var(--oikeus);margin-top:.3em;}

  .haz{display:flex;align-items:center;gap:6px;margin:.35em 0;}
  .blocks{letter-spacing:-1px;font-family:"IBM Plex Mono",monospace;}
  .blocks .on{color:var(--ember);}.blocks .off{color:var(--rule);}
  .haz .n{font-family:"IBM Plex Mono",monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);}
  .pill{font-family:"IBM Plex Mono",monospace;font-size:.5rem;letter-spacing:.05em;text-transform:uppercase;padding:.18em .45em;border-radius:20px;display:inline-block;margin:.12em .2em .12em 0;}
  .p-ppe{background:var(--paper-deep);color:var(--ink);border:1px solid var(--rule);}
  .p-val{background:var(--ember);color:#fff;}
  .p-luonnos{background:rgba(190,138,46,.25);color:#7a5a12;}
  .p-tarkistettu{background:rgba(79,110,146,.2);color:#33506e;}
  .p-hyvaksytty{background:rgba(94,140,90,.22);color:#3c5e39;}

  .detail{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:16px 18px;margin-bottom:14px;}
  .detail h3{font-size:1.5rem;}
  .drow{padding:.5em 0;border-top:1px dashed var(--rule);font-size:.93rem;}
  .drow .dl{font-family:"IBM Plex Mono",monospace;font-size:.56rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:.15em;}
  .drow ol,.drow ul{margin:.2em 0 0;padding-left:1.2em;}
  .drow li{margin:.2em 0;}
  .warnbox{background:rgba(206,63,27,.1);border-left:4px solid var(--ember);border-radius:4px;padding:.6em .8em;font-size:.88rem;margin:.6em 0;}
  .okbox{background:rgba(94,140,90,.12);border-left:4px solid var(--vihrea);border-radius:4px;padding:.6em .8em;font-size:.88rem;margin:.6em 0;}
  .infobox{background:var(--paper-deep);border-left:4px solid var(--steel);border-radius:4px;padding:.6em .8em;font-size:.88rem;margin:.6em 0;}

  .tblwrap{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;font-size:.84rem;}
  th,td{border-bottom:1px solid var(--rule);padding:.42em .5em;text-align:left;vertical-align:top;}
  th{font-family:"IBM Plex Mono",monospace;font-size:.54rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);}
  code{font-family:"IBM Plex Mono",monospace;font-size:.85em;background:#fff;border:1px solid var(--rule);border-radius:3px;padding:.05em .35em;}

  .msg{font-size:.85rem;padding:.5em .7em;border-radius:4px;margin:.5em 0;}
  .msg.ok{background:rgba(94,140,90,.12);border-left:3px solid var(--vihrea);color:#3c5e39;}
  .msg.err{background:rgba(206,63,27,.1);border-left:3px solid var(--ember);color:#8f2a10;}
  .msg.info{background:var(--paper-deep);border-left:3px solid var(--steel);color:var(--ink-soft);}
  .staffbar{background:var(--paper-deep);border:1px solid var(--rule);border-left:5px solid var(--ember);border-radius:8px;padding:11px 14px;margin-bottom:13px;display:flex;flex-wrap:wrap;gap:9px;align-items:center;}
  .staffbar .st{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);}
  .staffbar .st b{color:var(--ember);}
  .mcard.del{opacity:.55;border-left-color:var(--ink-soft)!important;background:repeating-linear-gradient(45deg,#EFE9DD,#EFE9DD 8px,#E7E0D2 8px,#E7E0D2 16px);}
  .p-del{background:var(--ink-soft);color:#fff;}
  .editgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:640px){.editgrid{grid-template-columns:1fr;}}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:.2em;}
  .chip{font-family:"IBM Plex Mono",monospace;font-size:.56rem;letter-spacing:.04em;text-transform:uppercase;
    border:1px solid var(--rule);background:#fff;color:var(--ink-soft);padding:.3em .55em;border-radius:20px;cursor:pointer;}
  .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .note{font-family:"IBM Plex Mono",monospace;font-size:.6rem;color:var(--ink-soft);line-height:1.7;margin-top:14px;border-top:1px solid var(--rule);padding-top:9px;}
</style>
</head>
<body>
<script src="paja-data.js"></script>
<script src="paja-config.js"></script>
<script>
/* Varmistus: jos jaettu tietolähde ei latatunut, kerro se näkyvästi.
   Hiljainen tyhjä lista on turvallisuustyökalussa vaarallinen. */
(function(){
  if(window.PAJA) return;
  document.addEventListener("DOMContentLoaded", function(){
    var d=document.createElement("div");
    d.setAttribute("role","alert");
    d.style.cssText="position:sticky;top:0;z-index:9999;background:#CE3F1B;color:#fff;padding:12px 16px;"
      + "font-family:'IBM Plex Mono',monospace;font-size:.78rem;line-height:1.6;";
    d.innerHTML="<b>Tietolähde puuttuu.</b> Tiedosto paja-data.js ei latautunut, joten koneet, tilat ja "
      + "suojaimet eivät näy. Varmista että kaikki tiedostot ovat samassa kansiossa. "
      + "Älä käytä tätä sivua ohjeena ennen kuin tieto näkyy.";
    document.body.insertBefore(d, document.body.firstChild);
  });
})();
</script>

<script src="pajakuutio-nav.js"></script>
<div class="wrap">

  <header class="head">
    <h1>Kone<span class="e">rekisteri</span></h1>
    <p>Koneiden ja työkalujen tiedot, vaaraluokat, siivous- ja huolto-ohjeet sekä sijainnit. Tämä on se tietopohja, josta pajaäly ohjaa opiskelijaa livenä. Jokainen kortti tarkistetaan ja hyväksytään ennen käyttöä.</p>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main class="view" id="view"></main>
  <div class="note" id="note"></div>
</div>

<script>
(function(){
  "use strict";
  var KEY="paja_konerekisteri_v1";
  var current="koneet", openId="", q="", roomF="", statusF="", editId="", showDeleted=false;
  function STAFF(){ return window.PAJA && PAJA.isStaff(); }
  function staffName(){ try{ return localStorage.getItem("paja_staff_name")||""; }catch(e){ return ""; } }
  function setStaffName(n){ try{ localStorage.setItem("paja_staff_name",n); }catch(e){} }

  var ROOMS=(window.PAJA?PAJA.roomNames():[]);
  var HAZ={1:"Matala",2:"Kohtalainen",3:"Keskitaso",4:"Korkea",5:"Erittäin korkea"};
  var PPE=(window.PAJA?PAJA.ppe():[]);

  /* ---------------------------------------------------------
     SIEMENDATA
     Koneet on poimittu Mikan omista dokumenteista ja aiemmista
     kurssikuvauksista. Sisältö on LUONNOS: pajamestari tarkistaa
     ja hyväksyy jokaisen kortin ennen käyttöä.
     --------------------------------------------------------- */
  function seedMachines(){ return (window.PAJA?JSON.parse(JSON.stringify(PAJA.allMachines())):[]); }

  function seedTools(){ return (window.PAJA?JSON.parse(JSON.stringify(PAJA.tools())):[]); }

  var DB={machines:[],tools:[],tasks:[],log:[]};
  function load(){ try{ var s=localStorage.getItem(KEY); if(s){ var d=JSON.parse(s);
    DB.machines=d.machines||[]; DB.tools=d.tools||[]; DB.tasks=d.tasks||[]; DB.log=d.log||[]; } }catch(e){} }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); return true; }catch(e){ flash("Tallennus ei onnistunut.","err"); return false; } }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function nowISO(){ return new Date().toISOString(); }
  function fmtD(iso){ if(!iso) return "–"; var d=new Date(iso); return d.getDate()+"."+(d.getMonth()+1)+"."+d.getFullYear(); }
  function byId(id){ var a=DB.machines.filter(function(m){ return m.id===id; }); return a.length?a[0]:null; }
  var flashMsg=null;
  function flash(t,k){ flashMsg={t:t,k:k}; render(); }

  function hazBlocks(h){
    var on="",off="",i;
    for(i=0;i<h;i++) on+="■"; for(i=h;i<5;i++) off+="■";
    return '<span class="haz"><span class="blocks"><span class="on">'+on+'</span><span class="off">'+off+'</span></span><span class="n">'+h+" / 5 · "+HAZ[h]+'</span></span>';
  }
  function statusPill(s){
    var lab={luonnos:"Luonnos",tarkistettu:"Tarkistettu",hyvaksytty:"Hyväksytty"};
    return '<span class="pill p-'+s+'">'+lab[s]+'</span>';
  }
  function counts(){
    var c={luonnos:0,tarkistettu:0,hyvaksytty:0},i;
    for(i=0;i<DB.machines.length;i++){ c[DB.machines[i].status]=(c[DB.machines[i].status]||0)+1; }
    return c;
  }

  // ================= HENKILÖKUNNAN TILA =================
  function staffBarHTML(){
    if(!window.PAJA) return "";
    if(!STAFF()){
      return '<div class="staffbar"><span class="st">Katselutila — tiedot ovat vain luettavissa</span>'
        + '<input type="password" id="stPin" placeholder="Tunnusluku" style="max-width:150px;padding:.4em .5em;border:1px solid var(--rule);border-radius:4px;font-family:Spectral,serif;">'
        + '<button class="btn" id="stOpen">Avaa henkilökunnan tila</button></div>';
    }
    var ch=PAJA.changeCount(), del=PAJA.deletedCount();
    return '<div class="staffbar"><span class="st"><b>Henkilökunnan tila</b> — voit lisätä, korjata ja poistaa</span>'
      + '<input type="text" id="stName" value="'+esc(staffName())+'" placeholder="Nimesi" style="max-width:170px;padding:.4em .5em;border:1px solid var(--rule);border-radius:4px;font-family:Spectral,serif;">'
      + '<button class="btn primary" id="stNew">Lisää uusi kone</button>'
      + '<button class="btn ghost" id="stDel">'+(showDeleted?"Piilota poistetut":"Näytä poistetut ("+del+")")+'</button>'
      + '<button class="btn ghost" id="stExp">Vie muutokset</button>'
      + '<button class="btn ghost" id="stClose">Poistu</button>'
      + '<span class="st">'+ch+' muutosta tallennettu</span></div>';
  }

  function chipsHTML(name,all,sel){
    var s='<div class="chips">',i;
    for(i=0;i<all.length;i++){
      var on=(sel||[]).indexOf(all[i])>-1;
      s+='<span class="chip'+(on?" on":"")+'" data-chip="'+name+'" data-val="'+esc(all[i])+'">'+esc(all[i])+'</span>';
    }
    return s+'</div>';
  }
  function lines(a){ return (a||[]).join("\n"); }
  function toLines(v){ return String(v||"").split("\n").map(function(x){ return x.trim(); }).filter(function(x){ return x.length>0; }); }

  var editDraft=null;
  function editHTML(){
    var m=editDraft;
    var isNew=!byId(m.id);
    var ro="",i,rooms=(window.PAJA?PAJA.roomNames():[]);
    for(i=0;i<rooms.length;i++){ ro+='<option value="'+esc(rooms[i])+'"'+(m.room===rooms[i]?" selected":"")+'>'+esc(rooms[i])+'</option>'; }
    var ho="";
    for(i=1;i<=5;i++){ ho+='<option value="'+i+'"'+(m.haz===i?" selected":"")+'>'+i+' · '+HAZ[i]+'</option>'; }
    return '<div class="panel"><span class="kicker">'+(isNew?"Uusi kone":"Muokkaa")+'</span><h3>'+esc(m.name||"Uusi kone")+'</h3>'
      + '<div class="editgrid">'
      + '<div class="field"><label>Nimi</label><input type="text" id="eName" value="'+esc(m.name||"")+'"></div>'
      + '<div class="field"><label>Tila</label><select id="eRoom">'+ro+'</select></div>'
      + '<div class="field"><label>Paikkakoodi</label><input type="text" id="eLoc" value="'+esc(m.loc||"")+'" placeholder="ARA-PUU-A1"></div>'
      + '<div class="field"><label>Vaaraluokka</label><select id="eHaz">'+ho+'</select></div>'
      + '</div>'
      + '<label class="mono" style="font-size:.7rem;display:block;margin:.5em 0;"><input type="checkbox" id="ePermit"'+(m.permit?" checked":"")+'> Käyttölupa vaaditaan</label>'
      + '<div class="field"><label>Käyttötarkoitus</label><input type="text" id="eUse" value="'+esc(m.use||"")+'"></div>'
      + '<div class="field"><label>Suojaimet (napauta valitaksesi)</label>'+chipsHTML("ppe",(window.PAJA?PAJA.ppe():[]),m.ppe)+'</div>'
      + '<div class="editgrid" style="margin-top:.6em;">'
      + '<div class="field"><label>Käynnistys (yksi vaihe riviä kohti)</label><textarea id="eStart" rows="5">'+esc(lines(m.start))+'</textarea></div>'
      + '<div class="field"><label>Sammutus ja lopetus</label><textarea id="eStop" rows="5">'+esc(lines(m.stop))+'</textarea></div>'
      + '<div class="field"><label>Turvasäännöt</label><textarea id="eRules" rows="5">'+esc(lines(m.rules))+'</textarea></div>'
      + '<div class="field"><label>Siivous</label><textarea id="eClean" rows="5">'+esc(m.clean||"")+'</textarea></div>'
      + '<div class="field"><label>Opiskelijan huolto</label><textarea id="eMs" rows="4">'+esc(lines(m.maint_student))+'</textarea></div>'
      + '<div class="field"><label>Vain henkilökunta</label><textarea id="eMt" rows="4">'+esc(lines(m.maint_staff))+'</textarea></div>'
      + '</div>'
      + '<div class="field"><label>Lisätieto (valinnainen)</label><input type="text" id="eExtra" value="'+esc(m.extra||"")+'"></div>'
      + '<div id="eMsg"></div>'
      + '<div class="btnrow"><button class="btn primary" id="eSave">Tallenna</button>'
      + '<button class="btn ghost" id="eCancel">Peruuta</button></div>'
      + '<div class="msg info" style="margin-top:.6em;">Muutos tallentuu muutoskerrokseen ja näkyy heti kaikissa työkaluissa. Uusi tai muokattu kortti palaa tilaan <b>luonnos</b>, joten se on tarkistettava uudelleen ennen kuin se siirtyy pajaälylle.</div>'
      + '</div>';
  }

  // ================= KONEET =================
  function viewMachines(){
    if(DB.machines.length===0){
      return '<div class="panel"><span class="kicker">Aloitus</span><h3>Rekisteri on tyhjä</h3>'
        + '<p class="lead">Lataa pohja-aineisto: koneet, jotka löytyvät omista perehdytys- ja kurssidokumenteistanne, valmiiksi kortteina. Täydennä ja tarkista ne.</p>'
        + '<div class="btnrow"><button class="btn primary" id="seed">Lataa pohja-aineisto</button></div></div>';
    }
    if(editId){ return editHTML(); }
    if(openId){ var m=byId(openId); if(m) return detailHTML(m)
      +'<div class="btnrow"><button class="btn ghost" id="closeD">Takaisin listaan</button>'
      +(STAFF()?'<button class="btn primary" id="editThis">Muokkaa</button>'
        +(m.deleted?'<button class="btn ok" id="restoreThis">Palauta käyttöön</button>'
                   :'<button class="btn ghost" id="delThis">Poista näkyvistä</button>'):"")
      +'</div>'; }

    var c=counts();
    var s=staffBarHTML();
    s+='<div class="msg err"><b>Tarkistamaton sisältö ei ole käyttöohje.</b> Pohja-aineisto on koottu teidän omista dokumenteistanne ja yleisestä koneturvallisuudesta. Jokainen kortti on tarkistettava konetta vasten ja hyväksyttävä ennen kuin sitä käytetään opetuksessa tai pajaälyn tietopohjana.</div>';
    s+='<div class="kpis">'
      + '<div class="kpi"><div class="k">Koneita</div><div class="v">'+DB.machines.length+'</div></div>'
      + '<div class="kpi"><div class="k">Luonnos</div><div class="v" style="color:var(--laatu)">'+(c.luonnos||0)+'</div></div>'
      + '<div class="kpi"><div class="k">Tarkistettu</div><div class="v" style="color:var(--oikeus)">'+(c.tarkistettu||0)+'</div></div>'
      + '<div class="kpi"><div class="k">Hyväksytty</div><div class="v" style="color:var(--vihrea)">'+(c.hyvaksytty||0)+'</div></div>'
      + '<div class="kpi"><div class="k">Lupa vaaditaan</div><div class="v">'+DB.machines.filter(function(m){return m.permit;}).length+'</div></div></div>';

    var ro='<option value="">Kaikki tilat</option>',i;
    for(i=0;i<ROOMS.length;i++){ ro+='<option value="'+esc(ROOMS[i])+'"'+(roomF===ROOMS[i]?" selected":"")+'>'+esc(ROOMS[i])+'</option>'; }
    var so='<option value="">Kaikki tilat</option>';
    var st=[["luonnos","Luonnos"],["tarkistettu","Tarkistettu"],["hyvaksytty","Hyväksytty"]];
    so='<option value="">Kaikki tilanteet</option>';

  function bindEdit(){
    document.querySelectorAll("[data-chip]").forEach(function(c){ c.addEventListener("click", function(){
      var v=c.getAttribute("data-val");
      editDraft.ppe=editDraft.ppe||[];
      var i=editDraft.ppe.indexOf(v);
      if(i>-1) editDraft.ppe.splice(i,1); else editDraft.ppe.push(v);
      c.classList.toggle("on"); }); });
    var sv=document.getElementById("eSave");
    if(sv){ sv.addEventListener("click", function(){
      var by=staffName();
      if(by.length<2){ document.getElementById("eMsg").innerHTML='<div class="msg err">Kirjoita nimesi henkilökunnan palkkiin ennen tallennusta.</div>'; return; }
      var nm=document.getElementById("eName").value.trim();
      if(nm.length<2){ document.getElementById("eMsg").innerHTML='<div class="msg err">Kirjoita koneen nimi.</div>'; return; }
      var loc=document.getElementById("eLoc").value.trim().toUpperCase();
      if(loc.length<5){ document.getElementById("eMsg").innerHTML='<div class="msg err">Anna paikkakoodi, esim. ARA-PUU-A1.</div>'; return; }
      editDraft.name=nm; editDraft.loc=loc;
      editDraft.room=document.getElementById("eRoom").value;
      editDraft.haz=parseInt(document.getElementById("eHaz").value,10);
      editDraft.permit=document.getElementById("ePermit").checked;
      editDraft.use=document.getElementById("eUse").value.trim();
      editDraft.start=toLines(document.getElementById("eStart").value);
      editDraft.stop=toLines(document.getElementById("eStop").value);
      editDraft.rules=toLines(document.getElementById("eRules").value);
      editDraft.clean=document.getElementById("eClean").value.trim();
      editDraft.maint_student=toLines(document.getElementById("eMs").value);
      editDraft.maint_staff=toLines(document.getElementById("eMt").value);
      editDraft.extra=document.getElementById("eExtra").value.trim();
      // muokattu kortti palaa tarkistettavaksi
      editDraft.status="luonnos"; delete editDraft.approvedBy; delete editDraft.approvedAt;
      if(editDraft.haz>=4) editDraft.permit=true;
      PAJA.saveMachine(editDraft,by);
      DB.machines=seedMachines();
      DB.log.push({ts:nowISO(),text:"Muokattu: "+editDraft.name+" ("+by+")"});
      save(); editId=""; editDraft=null; flash("Tallennettu. Kortti on tarkistettava uudelleen.","ok"); }); }

  function bindMachines(){
    bindStaff();
    if(editId){ bindEdit(); return; }
    var et=document.getElementById("editThis");
    if(et){ et.addEventListener("click", function(){
      var m=byId(openId); if(!m) return;
      editDraft=JSON.parse(JSON.stringify(m)); editId=m.id; openId=""; render(); }); }
    var dt=document.getElementById("delThis");
    if(dt){ dt.addEventListener("click", function(){
      var by=staffName();
      if(by.length<2){ flash("Kirjoita nimesi henkilökunnan palkkiin ennen poistoa.","err"); return; }
      var m=byId(openId); if(!m) return;
      var reason=window.prompt("Miksi poistetaan näkyvistä? (esim. poistettu käytöstä)","")||"";
      PAJA.deleteMachine(m.id,by,reason);
      DB.machines=seedMachines();
      DB.log.push({ts:nowISO(),text:"Poistettu näkyvistä: "+m.name+" ("+by+")"});
      save(); openId=""; flash(m.name+" poistettu näkyvistä. Tieto säilyy ja on palautettavissa.","ok"); }); }
    var rt=document.getElementById("restoreThis");
    if(rt){ rt.addEventListener("click", function(){
      var by=staffName();
      if(by.length<2){ flash("Kirjoita nimesi ennen palautusta.","err"); return; }
      var m=byId(openId); if(!m) return;
      PAJA.restoreMachine(m.id,by);
      DB.machines=seedMachines();
      save(); flash(m.name+" palautettu käyttöön.","ok"); }); }
    var sd=document.getElementById("seed");
    if(sd){ sd.addEventListener("click", function(){
      DB.machines=seedMachines(); DB.tools=seedTools();
      DB.log.push({ts:nowISO(),text:"Pohja-aineisto ladattu: "+DB.machines.length+" konetta"});
      save(); flash("Pohja-aineisto ladattu. Tarkista jokainen kortti.","ok"); }); }
    document.querySelectorAll("[data-open]").forEach(function(c){ c.addEventListener("click", function(){ openId=c.getAttribute("data-open"); render(); }); });

    var fs=document.getElementById("fs"); if(fs){ fs.addEventListener("change", function(){ statusF=fs.value; render(); }); }
    var fc=document.getElementById("fc"); if(fc){ fc.addEventListener("click", function(){ q=""; roomF=""; statusF=""; render(); }); }

    var ok=document.getElementById("apOk");
    if(ok){ ok.addEventListener("click", function(){
      var m=byId(openId), by=document.getElementById("apBy").value.trim();
      if(by.length<2){ flash("Kirjoita tarkistajan nimi.","err"); return; }
      m.status="hyvaksytty"; m.approvedBy=by; m.approvedAt=nowISO();
      DB.log.push({ts:nowISO(),text:"Hyväksytty: "+m.name+" ("+by+")"});
      save(); flash(m.name+" hyväksytty.","ok"); }); }
    var ch=document.getElementById("apCheck");
    if(ch){ ch.addEventListener("click", function(){
      var m=byId(openId), by=document.getElementById("apBy").value.trim();
      if(by.length<2){ flash("Kirjoita tarkistajan nimi.","err"); return; }
      m.status="tarkistettu"; m.approvedBy=by; m.approvedAt=nowISO();
      DB.log.push({ts:nowISO(),text:"Tarkistettu: "+m.name+" ("+by+")"});
      save(); flash(m.name+" merkitty tarkistetuksi.","ok"); }); }
  }

      for(i=lg.length-1;i>=0 && i>lg.length-26;i--){ var l=lg[i];
        s+='<tr><td class="mono" style="font-size:.72rem;">'+fmtD(l.ts)+'</td>'
          + '<td><span class="pill '+(l.action==="poistettu"?"p-del":(l.action==="lisatty"?"p-hyvaksytty":"p-tarkistettu"))+'">'+esc(l.action)+'</span></td>'
          + '<td>'+esc(l.name||l.id)+(l.reason?' <span style="color:var(--ink-soft);font-size:.85em;">— '+esc(l.reason)+'</span>':'')+'</td>'
          + '<td class="mono" style="font-size:.72rem;">'+esc(l.by||"")+'</td></tr>'; }
      s+='</tbody></table></div></div>';
    }
    s+='<div class="panel"><span class="kicker">Rajat</span><h3>Mitä pajaäly saa ja ei saa tehdä</h3>'
      + '<div class="tblwrap"><table><thead><tr><th>Saa</th><th>Ei saa</th></tr></thead><tbody>'
      + '<tr><td>Kertoa koneen käyttötarkoituksen ja vaaraluokan</td><td>Antaa käyttölupaa tai korvata perehdytystä</td></tr>'
      + '<tr><td>Näyttää käynnistys- ja sammutusvaiheet hyväksytystä kortista</td><td>Keksiä ohjetta koneesta, jota ei ole hyväksytty</td></tr>'
      + '<tr><td>Kertoa missä työkalu sijaitsee (paikkakoodi)</td><td>Neuvoa ohittamaan suojus tai turvalaite</td></tr>'
      + '<tr><td>Muistuttaa suojaimista ja siivouksesta</td><td>Vahvistaa pätevyyttä opiskelijan puolesta</td></tr>'
      + '<tr><td>Ehdottaa työmenetelmää perusteluineen</td><td>Ehdottaa menetelmää, joka ylittää opiskelijan tason</td></tr>'
      + '<tr><td>Ohjata kysymään pajamestarilta epäselvässä tilanteessa</td><td>Antaa kemikaaliohjetta ilman käyttöturvallisuustiedotetta</td></tr>'
      + '</tbody></table></div>'
      + '<div class="infobox"><b>Ohjauksen sävy:</b> lempeä mutta päättäväinen. Ei nolaa, ei rankaise, mutta ei jousta turvallisuudesta. Epävarmassa tilanteessa ohjaa ihmisen puheille — se on oikea vastaus, ei epäonnistuminen.</div></div>';
    return s;
  }
  function aiPayload(){
    var appr=DB.machines.filter(function(m){ return m.status==="hyvaksytty"; });
    return {
      version:"1.0", generated:nowISO(), site:"Metropolia Muotoilun Pajat, Arabia",
      note:"Vain hyväksytyt konekortit. Pajaäly ei saa antaa ohjetta koneesta, jota ei ole tässä.",
      rules:{
        allowed:["Käyttötarkoitus ja vaaraluokka","Hyväksytyn kortin vaiheet","Työkalun sijainti","Suojain- ja siivousmuistutus","Perusteltu menetelmäehdotus"],
        forbidden:["Käyttöluvan myöntäminen","Ohjeen keksiminen","Suojuksen ohittaminen","Pätevyyden vahvistaminen","Kemikaaliohje ilman KTT:tä"],
        escalate:"Epäselvässä tai turvallisuuskriittisessä tilanteessa ohjaa pajamestarin puheille."
      },
      machines:appr.map(function(m){
        return { id:m.id, name:m.name, room:m.room, location:m.loc, hazard:m.haz, hazardLabel:HAZ[m.haz],
          permitRequired:!!m.permit, ppe:m.ppe, purpose:m.use, startup:m.start, shutdown:m.stop,
          safetyRules:m.rules, cleaning:m.clean, maintenanceStudent:m.maint_student, maintenanceStaff:m.maint_staff,
          notes:m.extra||"", approvedBy:m.approvedBy||"", approvedAt:m.approvedAt||"" };
      }),
      tools:DB.tools.map(function(t){ return { name:t.name, location:t.loc, room:t.room, note:t.note }; }),
      locationCode:{ format:"TILA-KAAPPI-LAATIKKO", example:"PUU-K3-L2",
        rooms:(window.PAJA?PAJA.rooms().reduce(function(o,r){o[r.code]=r.name;return o;},{}):{}) }
    };
  }
  function bindAI(){
    function dl(txt,name,mime){
      try{ var b=new Blob([txt],{type:mime}),u=URL.createObjectURL(b),a=document.createElement("a");
        a.href=u; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(u); },1000);
      }catch(e){ flash("Lataus ei onnistunut.","err"); }
    }
    var a=document.getElementById("expAI");
    if(a){ a.addEventListener("click", function(){
      var pl=aiPayload();
      if(pl.machines.length===0){ flash("Ei hyväksyttyjä kortteja vietäväksi.","err"); return; }
      dl(JSON.stringify(pl,null,2),"pajaaly_tietopohja.json","application/json"); }); }
    var b=document.getElementById("expAll");
    if(b){ b.addEventListener("click", function(){ dl(JSON.stringify(DB,null,2),"konerekisteri_kaikki.json","application/json"); }); }
    var c=document.getElementById("expCsv");
    if(c){ c.addEventListener("click", function(){
      function cc(x){ return String(x==null?"":x).replace(/;/g," ").replace(/[\r\n]+/g," "); }
      var rows=["Kone;Tila;Paikka;Vaara;Lupa;Suojaimet;Kayttotarkoitus;Siivous;Tilanne;Hyvaksyja"],i;
      for(i=0;i<DB.machines.length;i++){ var m=DB.machines[i];
        rows.push([cc(m.name),cc(m.room),cc(m.loc),m.haz,m.permit?"kyllä":"ei",cc((m.ppe||[]).join(", ")),
          cc(m.use),cc(m.clean),cc(m.status),cc(m.approvedBy)].join(";")); }
      dl("\ufeff"+rows.join("\r\n"),"konerekisteri.csv","text/csv;charset=utf-8"); }); }
  }

  // ================= ROUTER =================
  var TABS=[
    { id:"koneet", label:"Koneet", render:viewMachines, bind:bindMachines },
    { id:"sijainnit", label:"Sijainnit ja työkalut", render:viewLocations, bind:bindLocations },
    { id:"tehtavat", label:"Tehtäväkuvaukset", render:viewTasks, bind:null },
    { id:"pajaaly", label:"Pajaäly", render:viewAI, bind:bindAI }
  ];
  function render(){
    var el=document.getElementById("tabs"),s="",i;
    var c=counts(), pend=(c.luonnos||0);
    for(i=0;i<TABS.length;i++){
      var extra=(TABS[i].id==="koneet"&&pend>0)?'<span class="n">'+pend+'</span>':"";
      s+='<button class="tab'+(TABS[i].id===current?" active":"")+'" data-tab="'+TABS[i].id+'">'+TABS[i].label+extra+'</button>'; }
    el.innerHTML=s;
    el.querySelectorAll("[data-tab]").forEach(function(b){ b.addEventListener("click", function(){ current=b.getAttribute("data-tab"); openId=""; flashMsg=null; render(); }); });
    var t=null; for(i=0;i<TABS.length;i++){ if(TABS[i].id===current) t=TABS[i]; }
    var html=t.render();
    if(flashMsg){ html='<div class="msg '+flashMsg.k+'">'+esc(flashMsg.t)+'</div>'+html; flashMsg=null; }
    document.getElementById("view").innerHTML=html;
    if(t.bind) t.bind();
    document.getElementById("note").innerHTML=
      "Konekohtainen perehdytys ja käyttölupa ovat lakisääteisiä (työturvallisuuslaki 738/2002, käyttöasetus 403/2008). "
      + "Tämä rekisteri ei korvaa perehdytystä vaan tukee sitä. Pohja-aineisto on luonnos, joka on tarkistettava konetta vasten ennen käyttöä. "
      + "Pilotti: tiedot tallentuvat selaimeen — vie varmuuskopio Pajaäly-välilehdeltä.";
  }

  load(); render();
})();
</script>
<script src="paja-footer.js"></script>
</body>
</html>
