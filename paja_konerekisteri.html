  var DB={machines:[],tools:[],tasks:[],log:[]};

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function byId(id){ var a=DB.machines.filter(function(m){ return m.id===id; }); return a.length?a[0]:null; }
  var flashMsg=null;
  function flash(t,k){ flashMsg={t:t,k:k}; render(); }

  function hazBlocks(h){
    var on="",off="",i;
    for(i=0;i<h;i++) on+="■"; for(i=h;i<5;i++) off+="■";
    return '<span class="haz"><span class="blocks"><span class="on">'+on+'</span><span class="off">'+off+'</span></span><span class="n">'+h+" / 5 · "+HAZ[h]+'</span></span>';
  }
  function statusPill(s){
    var lab={luonnos:"Luonnos",tarkistettu:"Tarkistettu",hyvaksytty:"Hyväksytty"};
    return '<span class="pill p-'+s+'">'+lab[s]+'</span>';
  }
  function counts(){
    var c={luonnos:0,tarkistettu:0,hyvaksytty:0},i;
    for(i=0;i<DB.machines.length;i++){ c[DB.machines[i].status]=(c[DB.machines[i].status]||0)+1; }
    return c;
  }

  function bindMachines(){
    var sd=document.getElementById("seed");
    if(sd){ sd.addEventListener("click", function(){
      DB.machines=seedMachines(); DB.tools=seedTools();
      DB.log.push({ts:nowISO(),text:"Pohja-aineisto ladattu: "+DB.machines.length+" konetta"});
      save(); flash("Pohja-aineisto ladattu. Tarkista jokainen kortti.","ok"); }); }
    document.querySelectorAll("[data-open]").forEach(function(c){ c.addEventListener("click", function(){ openId=c.getAttribute("data-open"); render(); }); });
    var cd=document.getElementById("closeD"); if(cd){ cd.addEventListener("click", function(){ openId=""; render(); }); }
    var fq=document.getElementById("fq");
    if(fq){ fq.addEventListener("input", function(){ q=fq.value; var p=fq.selectionStart; render();
      var n=document.getElementById("fq"); if(n){ n.focus(); n.setSelectionRange(p,p); } }); }
    var fr=document.getElementById("fr"); if(fr){ fr.addEventListener("change", function(){ roomF=fr.value; render(); }); }
    var fs=document.getElementById("fs"); if(fs){ fs.addEventListener("change", function(){ statusF=fs.value; render(); }); }
    var fc=document.getElementById("fc"); if(fc){ fc.addEventListener("click", function(){ q=""; roomF=""; statusF=""; render(); }); }

    var ok=document.getElementById("apOk");
    if(ok){ ok.addEventListener("click", function(){
      var m=byId(openId), by=document.getElementById("apBy").value.trim();
      if(by.length<2){ flash("Kirjoita tarkistajan nimi.","err"); return; }
      m.status="hyvaksytty"; m.approvedBy=by; m.approvedAt=nowISO();
      DB.log.push({ts:nowISO(),text:"Hyväksytty: "+m.name+" ("+by+")"});
      save(); flash(m.name+" hyväksytty.","ok"); }); }
    var ch=document.getElementById("apCheck");
    if(ch){ ch.addEventListener("click", function(){
      var m=byId(openId), by=document.getElementById("apBy").value.trim();
      if(by.length<2){ flash("Kirjoita tarkistajan nimi.","err"); return; }
      m.status="tarkistettu"; m.approvedBy=by; m.approvedAt=nowISO();
      DB.log.push({ts:nowISO(),text:"Tarkistettu: "+m.name+" ("+by+")"});
      save(); flash(m.name+" merkitty tarkistetuksi.","ok"); }); }
  }

      + '<tr><td>Ohjata kysymään pajamestarilta epäselvässä tilanteessa</td><td>Antaa kemikaaliohjetta ilman käyttöturvallisuustiedotetta</td></tr>'
      + '</tbody></table></div>'
      + '<div class="infobox"><b>Ohjauksen sävy:</b> lempeä mutta päättäväinen. Ei nolaa, ei rankaise, mutta ei jousta turvallisuudesta. Epävarmassa tilanteessa ohjaa ihmisen puheille — se on oikea vastaus, ei epäonnistuminen.</div></div>';
    return s;
  }
  function aiPayload(){
    var appr=DB.machines.filter(function(m){ return m.status==="hyvaksytty"; });
    return {
      version:"1.0", generated:nowISO(), site:"Metropolia Muotoilun Pajat, Arabia",
      note:"Vain hyväksytyt konekortit. Pajaäly ei saa antaa ohjetta koneesta, jota ei ole tässä.",
      rules:{
        allowed:["Käyttötarkoitus ja vaaraluokka","Hyväksytyn kortin vaiheet","Työkalun sijainti","Suojain- ja siivousmuistutus","Perusteltu menetelmäehdotus"],
        forbidden:["Käyttöluvan myöntäminen","Ohjeen keksiminen","Suojuksen ohittaminen","Pätevyyden vahvistaminen","Kemikaaliohje ilman KTT:tä"],
        escalate:"Epäselvässä tai turvallisuuskriittisessä tilanteessa ohjaa pajamestarin puheille."
      },
      machines:appr.map(function(m){
        return { id:m.id, name:m.name, room:m.room, location:m.loc, hazard:m.haz, hazardLabel:HAZ[m.haz],
          permitRequired:!!m.permit, ppe:m.ppe, purpose:m.use, startup:m.start, shutdown:m.stop,
          safetyRules:m.rules, cleaning:m.clean, maintenanceStudent:m.maint_student, maintenanceStaff:m.maint_staff,
          notes:m.extra||"", approvedBy:m.approvedBy||"", approvedAt:m.approvedAt||"" };
      }),
      tools:DB.tools.map(function(t){ return { name:t.name, location:t.loc, room:t.room, note:t.note }; }),
      locationCode:{ format:"TILA-KAAPPI-LAATIKKO", example:"PUU-K3-L2",
        rooms:{PUU:"Puustudio",PVA:"Puuvarasto",CNC:"Puu-CNC",MET:"Metallistudio",MVA:"Metallivarasto",PRO:"Protostudio",LAS:"CO2 Laser",TDT:"3D-tulostus",JAL:"Jalometallistudio",KUV:"Kuvanveisto",MAA:"Maalaamo",ESI:"Esikäsittelytila",YVA:"Yleisvarasto",HAK:"Häkkitila",VAL:"Valvomo"} }
    };
  }
  function bindAI(){
    function dl(txt,name,mime){
      try{ var b=new Blob([txt],{type:mime}),u=URL.createObjectURL(b),a=document.createElement("a");
        a.href=u; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(u); },1000);
      }catch(e){ flash("Lataus ei onnistunut.","err"); }
    }
    var a=document.getElementById("expAI");
    if(a){ a.addEventListener("click", function(){
      var pl=aiPayload();
      if(pl.machines.length===0){ flash("Ei hyväksyttyjä kortteja vietäväksi.","err"); return; }
      dl(JSON.stringify(pl,null,2),"pajaaly_tietopohja.json","application/json"); }); }
    var b=document.getElementById("expAll");
    if(b){ b.addEventListener("click", function(){ dl(JSON.stringify(DB,null,2),"konerekisteri_kaikki.json","application/json"); }); }
    var c=document.getElementById("expCsv");
    if(c){ c.addEventListener("click", function(){
      function cc(x){ return String(x==null?"":x).replace(/;/g," ").replace(/[\r\n]+/g," "); }
      var rows=["Kone;Tila;Paikka;Vaara;Lupa;Suojaimet;Kayttotarkoitus;Siivous;Tilanne;Hyvaksyja"],i;
      for(i=0;i<DB.machines.length;i++){ var m=DB.machines[i];
        rows.push([cc(m.name),cc(m.room),cc(m.loc),m.haz,m.permit?"kyllä":"ei",cc((m.ppe||[]).join(", ")),
          cc(m.use),cc(m.clean),cc(m.status),cc(m.approvedBy)].join(";")); }
      dl("\ufeff"+rows.join("\r\n"),"konerekisteri.csv","text/csv;charset=utf-8"); }); }
  }

  // ================= ROUTER =================
  var TABS=[
    { id:"koneet", label:"Koneet", render:viewMachines, bind:bindMachines },
    { id:"sijainnit", label:"Sijainnit ja työkalut", render:viewLocations, bind:bindLocations },
    { id:"tehtavat", label:"Tehtäväkuvaukset", render:viewTasks, bind:null },
    { id:"pajaaly", label:"Pajaäly", render:viewAI, bind:bindAI }
  ];
  function render(){
    var el=document.getElementById("tabs"),s="",i;
    var c=counts(), pend=(c.luonnos||0);
    for(i=0;i<TABS.length;i++){
      var extra=(TABS[i].id==="koneet"&&pend>0)?'<span class="n">'+pend+'</span>':"";
      s+='<button class="tab'+(TABS[i].id===current?" active":"")+'" data-tab="'+TABS[i].id+'">'+TABS[i].label+extra+'</button>'; }
    el.innerHTML=s;
    el.querySelectorAll("[data-tab]").forEach(function(b){ b.addEventListener("click", function(){ current=b.getAttribute("data-tab"); openId=""; flashMsg=null; render(); }); });
    var t=null; for(i=0;i<TABS.length;i++){ if(TABS[i].id===current) t=TABS[i]; }
    var html=t.render();
    if(flashMsg){ html='<div class="msg '+flashMsg.k+'">'+esc(flashMsg.t)+'</div>'+html; flashMsg=null; }
    document.getElementById("view").innerHTML=html;
    if(t.bind) t.bind();
    document.getElementById("note").innerHTML=
      "Konekohtainen perehdytys ja käyttölupa ovat lakisääteisiä (työturvallisuuslaki 738/2002, käyttöasetus 403/2008). "
      + "Tämä rekisteri ei korvaa perehdytystä vaan tukee sitä. Pohja-aineisto on luonnos, joka on tarkistettava konetta vasten ennen käyttöä. "
      + "Pilotti: tiedot tallentuvat selaimeen — vie varmuuskopio Pajaäly-välilehdeltä.";
  }

  load(); render();
})();
</script>
<script src="paja-footer.js"></script>
</body>
</html>
