<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paja-seuranta — ryhmä, kutsut, läsnäolo, tehtävät ja arviointi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ECE6DA;--paper-deep:#E4DCCC;--card:#F3EFE7;--ink:#211C16;--ink-soft:#5A5347;
    --ember:#CE3F1B;--rule:#C8BFAD;--rule-soft:#D8D0C0;
    --vihrea:#5E8C5A;--oikeus:#4F6E92;--turva:#C25A3E;--laatu:#BE8A2E;--projekti:#6E5A93;--talous:#4E8C84;--steel:#3D4B58;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Spectral",Georgia,serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 clamp(12px,3vw,26px) 60px;}
  h1,h2,h3,h4,h5{font-family:"Big Shoulders Display",Arial,sans-serif;font-weight:800;text-transform:uppercase;line-height:.95;margin:0;}
  .mono{font-family:"IBM Plex Mono",monospace;}
  p{margin:0 0 1em;}

  .head{padding:clamp(20px,4vw,34px) 0 10px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;}
  .head h1{font-size:clamp(1.9rem,5.5vw,3rem);}
  .head h1 .e{color:var(--ember);}
  .head p{color:var(--ink-soft);font-size:.92rem;max-width:62ch;margin:.4em 0 0;}
  .modebadge{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;padding:.4em .7em;border-radius:20px;}
  .modebadge.on{background:rgba(206,63,27,.12);color:#8f2a10;border:1px solid var(--ember);}
  .modebadge.off{background:var(--paper-deep);color:var(--ink-soft);border:1px solid var(--rule);}

  .tabs{position:sticky;top:0;z-index:20;background:var(--paper);display:flex;gap:4px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--rule);}
  .tab{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;cursor:pointer;border:1px solid var(--rule);background:var(--card);color:var(--ink-soft);padding:.55em .8em;border-radius:20px;flex:none;}
  .tab:hover{border-color:var(--ink-soft);color:var(--ink);}
  .tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .view{padding-top:18px;}
  .lead{color:var(--ink-soft);font-size:.93rem;max-width:72ch;margin:0 0 14px;}

  .panel{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;margin-bottom:14px;}
  .panel h3{font-size:1.15rem;margin-bottom:.4em;}
  .kicker{font-family:"IBM Plex Mono",monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ember);font-weight:600;display:block;margin-bottom:.25em;}

  .btn{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:.5em .85em;border-radius:3px;}
  .btn:hover{background:var(--ink);color:var(--paper);}
  .btn.primary{background:var(--ember);border-color:var(--ember);color:#fff;}
  .btn.primary:hover{background:#b0340f;}
  .btn.ghost{border-color:var(--rule);color:var(--ink-soft);}
  .btn.mini{font-size:.55rem;padding:.32em .55em;}
  .btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}

  .field{margin:.5em 0;}
  .field label{display:block;font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.2em;}
  .field input,.field select{width:100%;font-family:"Spectral",serif;font-size:.98rem;padding:.5em .6em;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink);}
  .field input:focus,.field select:focus{outline:2px solid var(--ember);border-color:var(--ember);}
  .inline{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;}
  .inline .field{flex:1;min-width:130px;margin:0;}

  .classgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px;margin-top:12px;}
  .pcard{background:#fff;border:1px solid var(--rule);border-radius:7px;padding:8px;text-align:center;}
  .pcard.staff{border-color:var(--steel);box-shadow:inset 0 3px 0 var(--steel);}
  .pcard .ph{width:100%;aspect-ratio:1;border-radius:6px;object-fit:cover;display:block;background:var(--paper-deep);}
  .pcard .noph{width:100%;aspect-ratio:1;border-radius:6px;background:repeating-linear-gradient(45deg,#EEE7D8,#EEE7D8 8px,#E7DFCE 8px,#E7DFCE 16px);display:grid;place-items:center;font-family:"Big Shoulders Display",Arial,sans-serif;font-size:1.5rem;color:var(--ink-soft);}
  .pcard .nm{font-family:"Big Shoulders Display",Arial,sans-serif;font-weight:700;text-transform:uppercase;font-size:.82rem;line-height:1;margin-top:6px;word-break:break-word;}
  .pcard .sid{font-family:"IBM Plex Mono",monospace;font-size:.54rem;color:var(--ink-soft);}
  .pcard .role{font-family:"IBM Plex Mono",monospace;font-size:.5rem;letter-spacing:.06em;text-transform:uppercase;padding:.15em .4em;border-radius:20px;display:inline-block;margin-top:3px;}
  .role.opiskelija{background:var(--paper-deep);color:var(--ink-soft);}
  .role.henkilokunta{background:var(--steel);color:#fff;}
  .pcard .acts{display:flex;gap:3px;justify-content:center;margin-top:5px;flex-wrap:wrap;}
  .grouphoto img{width:100%;border-radius:8px;display:block;}

  .pill{font-family:"IBM Plex Mono",monospace;font-size:.52rem;letter-spacing:.05em;text-transform:uppercase;padding:.2em .5em;border-radius:20px;display:inline-block;}
  .inv-ei{background:var(--paper-deep);color:var(--ink-soft);}
  .inv-kutsuttu{background:rgba(190,138,46,.25);color:#7a5a12;}
  .inv-hyvaksytty{background:rgba(94,140,90,.22);color:#3c5e39;}

  .tblwrap{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;font-size:.85rem;}
  th,td{border:1px solid var(--rule);padding:.38em .5em;text-align:center;}
  th{background:var(--paper-deep);font-family:"IBM Plex Mono",monospace;font-size:.56rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
  td.nm{text-align:left;white-space:nowrap;font-weight:600;}
  td.em{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--ink-soft);}
  .cellbtn{border:none;background:transparent;cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:.58rem;letter-spacing:.03em;text-transform:uppercase;padding:.25em .3em;border-radius:3px;width:100%;}
  .s-paikalla{background:rgba(94,140,90,.22);color:#3c5e39;}
  .s-myohassa{background:rgba(190,138,46,.25);color:#7a5a12;}
  .s-poissa{background:rgba(206,63,27,.16);color:#8f2a10;}
  .s-ei{background:var(--paper-deep);color:var(--ink-soft);}
  .s-kesken{background:rgba(190,138,46,.25);color:#7a5a12;}
  .s-valmis{background:rgba(94,140,90,.22);color:#3c5e39;}
  .gradecell{display:flex;gap:2px;align-items:center;justify-content:center;}
  .gsel{font-family:"IBM Plex Mono",monospace;font-size:.62rem;padding:.15em .2em;border:1px solid var(--rule);border-radius:3px;background:#fff;}
  .ontime{font-family:"IBM Plex Mono",monospace;font-size:.5rem;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--rule);border-radius:3px;cursor:pointer;padding:.2em .3em;background:#fff;color:var(--ink-soft);}
  .ontime.on{background:rgba(94,140,90,.22);color:#3c5e39;border-color:var(--vihrea);}
  .ontime.late{background:rgba(206,63,27,.16);color:#8f2a10;border-color:var(--ember);}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:14px;}
  .kpi{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;}
  .kpi .k{font-family:"IBM Plex Mono",monospace;font-size:.56rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);}
  .kpi .v{font-family:"Big Shoulders Display",Arial,sans-serif;font-weight:800;font-size:2rem;line-height:1;margin-top:.1em;}
  .kpi .v small{font-size:.85rem;color:var(--ink-soft);}
  .chart{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;margin-bottom:14px;}
  .chart h4{font-size:1.05rem;margin-bottom:.5em;}
  .plain{background:var(--paper-deep);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;}
  .plain h4{font-size:1.05rem;margin-bottom:.4em;}
  .plain ul{margin:.3em 0 0;padding-left:1.1em;}
  .plain li{margin:.25em 0;font-size:.92rem;}
  .plain li.ok::marker{color:var(--vihrea);}
  .plain li.warn::marker{color:var(--laatu);}
  .plain li.bad::marker{color:var(--ember);}

  .gradebig{display:flex;gap:18px;flex-wrap:wrap;align-items:center;}
  .gnum{font-family:"Big Shoulders Display",Arial,sans-serif;font-weight:800;font-size:4.6rem;line-height:.85;}
  .gsub{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);}
  .brkrow{margin:.5em 0;}
  .brkrow .bl{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:.6rem;text-transform:uppercase;color:var(--ink-soft);margin-bottom:2px;}
  .brkbar{height:10px;background:var(--rule-soft);border-radius:5px;overflow:hidden;}
  .brkbar i{display:block;height:100%;}

  .msg{font-size:.85rem;padding:.5em .7em;border-radius:4px;margin-top:.5em;}
  .msg.ok{background:rgba(94,140,90,.12);border-left:3px solid var(--vihrea);color:#3c5e39;}
  .msg.err{background:rgba(206,63,27,.1);border-left:3px solid var(--ember);color:#8f2a10;}
  .msg.info{background:var(--paper-deep);border-left:3px solid var(--steel);color:var(--ink-soft);}

  .note{font-family:"IBM Plex Mono",monospace;font-size:.62rem;color:var(--ink-soft);line-height:1.75;margin-top:16px;border-top:1px solid var(--rule);padding-top:10px;}
  @media print{.tabs,.btnrow,.btn{display:none !important;}}
</style>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="mhks-icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<div class="wrap">

  <header class="head">
    <div>
      <h1>Paja-<span class="e">seuranta</span></h1>
      <p>Ryhmä ja luokkakuva, massakutsut, läsnäolo, tehtävät ja reaaliaikainen arviointi. Opettajan tila avaa muokkauksen.</p>
    </div>
    <span class="modebadge off" id="modeBadge">Katselutila</span>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <main class="view" id="view"></main>
  <div class="note" id="note"></div>
</div>

<script>
(function(){
  "use strict";
  var KEY="paja_seuranta_v2";
  var TEACHER=false;
  var studentView="";
  var current="tilanne";

  var PHASES=[
    { id:1, name:"Alku", desc:"Aloitus, ryhmäytyminen ja kurssin tavoitteet." },
    { id:2, name:"Osaamisen tunnistus", desc:"Opiskelija tunnistaa ja sanoittaa oman lähtötasonsa esseenä." },
    { id:3, name:"Motivaatio", desc:"Opiskelija kirjoittaa esseen siitä, miksi on täällä ja mitä tavoittelee." },
    { id:4, name:"Perehdytys ja sisäistäminen", desc:"Turvallisuus, ajokortti ja pajatyöt — kurssin keskivaihe." },
    { id:5, name:"Päätöstilaisuus ja arvosanat", desc:"Töiden katselmus, palaute ja arvosanojen julkistus." }
  ];
  function phaseById(id){ var a=PHASES.filter(function(x){ return x.id===id; }); return a.length?a[0]:null; }

  function defaultTasks(){
    return [
      { id:"t_aloitus",   label:"Aloitus ja tavoitteet", group:"Alku",          phase:1, type:"tilaisuus" },
      { id:"t_osaaminen", label:"Osaamisen tunnistus",   group:"Essee",         phase:2, type:"essee" },
      { id:"t_motivaatio",label:"Motivaatio",            group:"Essee",         phase:3, type:"essee" },
      { id:"t_ajokortti", label:"Paja-ajokortti",        group:"Turvallisuus",  phase:4, type:"tehtava" },
      { id:"t_lasta",     label:"Paistinlasta",          group:"Puupaja",       phase:4, type:"tehtava" },
      { id:"t_lauta",     label:"Leikkuulauta",          group:"Puupaja",       phase:4, type:"tehtava" },
      { id:"t_rasia",     label:"Korurasia",             group:"Puupaja",       phase:4, type:"tehtava" },
      { id:"t_kavaletti", label:"Kavaletti",             group:"Metallipaja",   phase:4, type:"tehtava" },
      { id:"t_jakkara",   label:"Pikkujakkara",          group:"Metallipaja",   phase:4, type:"tehtava" },
      { id:"t_valineet",  label:"Työvälineet",           group:"Metallipaja",   phase:4, type:"tehtava" },
      { id:"t_paatos",    label:"Päätöstilaisuus",       group:"Päätös",        phase:5, type:"tilaisuus" }
    ];
  }
  var ESSAY_PROMPT={
    t_osaaminen:"Kuvaa omin sanoin, mitä osaat jo: aiemmat kädentaidot, koneet, materiaalit ja työtavat. Mikä tuntuu tutulta, mikä vieraalta? Missä haluat kehittyä eniten?",
    t_motivaatio:"Miksi olet täällä? Mitä haluat oppia tällä kurssilla ja mitä tavoittelet muotoilijana? Millainen tekeminen innostaa sinua?"
  };
  function defaultDB(){ return { people:[], days:[], att:{}, prog:{}, grade:{}, essay:{}, tasks:defaultTasks(), group:"", pin:"", groupPhoto:"", w:{att:30,ontime:20,quality:50} }; }
  var DB=defaultDB();

  function load(){ try{ var s=localStorage.getItem(KEY); if(s){ var d=JSON.parse(s);
    DB.people=d.people||[]; DB.days=d.days||[]; DB.att=d.att||{}; DB.prog=d.prog||{}; DB.grade=d.grade||{}; DB.essay=d.essay||{};
    DB.tasks=(d.tasks&&d.tasks.length&&d.tasks[0].phase)?d.tasks:defaultTasks(); DB.group=d.group||""; DB.pin=d.pin||"";
    DB.groupPhoto=d.groupPhoto||""; DB.w=d.w||{att:30,ontime:20,quality:50}; } }catch(e){} }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); return true; }
    catch(e){ flash("Tallennus ei onnistunut — muisti täynnä. Poista kuvia.","err"); return false; } }
  function uid(p){ return p+Math.random().toString(36).slice(2,7); }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function fiDate(iso){ if(!iso) return ""; var p=String(iso).split("-"); if(p.length<3) return iso; return parseInt(p[2],10)+"."+parseInt(p[1],10)+"."; }
  function initials(n){ var p=String(n).trim().split(/\s+/); if(p.length===1) return p[0].slice(0,2).toUpperCase(); return (p[0][0]+p[p.length-1][0]).toUpperCase(); }
  function students(){ return DB.people.filter(function(p){ return p.role==="opiskelija"; }); }
  function personById(id){ var a=DB.people.filter(function(p){ return p.id===id; }); return a.length?a[0]:null; }

  var flashMsg=null;
  function flash(t,k){ flashMsg={t:t,k:k}; render(); }

  function slug(s){ return String(s).toLowerCase().replace(/ä/g,"a").replace(/ö/g,"o").replace(/å/g,"a").replace(/[^a-z0-9]+/g,""); }
  function mailFor(name){ var p=String(name).trim().split(/\s+/);
    if(p.length<2) return slug(name)+"@metropolia.fi";
    return slug(p[0])+"."+slug(p[p.length-1])+"@metropolia.fi"; }

  function shrink(file,size,quality,cb){
    var fr=new FileReader();
    fr.onload=function(){ var img=new Image();
      img.onload=function(){ var c=document.createElement("canvas"),ctx;
        if(size===0){ var W=900,r=W/img.width; c.width=W; c.height=Math.round(img.height*r); ctx=c.getContext("2d"); ctx.drawImage(img,0,0,c.width,c.height); }
        else { c.width=size; c.height=size; ctx=c.getContext("2d"); var side=Math.min(img.width,img.height); ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,size,size); }
        cb(c.toDataURL("image/jpeg",quality)); };
      img.onerror=function(){ cb(null); }; img.src=fr.result; };
    fr.onerror=function(){ cb(null); }; fr.readAsDataURL(file);
  }

  // ============ ARVIOINTI ============
  function attStats(pid){
    var pres=0,marked=0,j;
    for(j=0;j<DB.days.length;j++){ var v=DB.att[pid+":"+DB.days[j].date];
      if(v){ marked++; if(v==="paikalla") pres+=1; else if(v==="myohassa") pres+=0.5; } }
    return { pct: marked>0?Math.round(pres/marked*100):null, marked:marked };
  }
  function gradeStats(pid){
    var qs=[],onTime=0,graded=0,j;
    for(j=0;j<DB.tasks.length;j++){ var g=DB.grade[pid+":"+DB.tasks[j].id];
      if(g&&g.q){ qs.push(g.q); graded++; if(g.ontime!==false) onTime++; } }
    var qAvg=qs.length?(qs.reduce(function(a,b){ return a+b; },0)/qs.length):null;
    return { qAvg:qAvg, qPct:qAvg!=null?Math.round(qAvg/5*100):null, onTimePct:graded>0?Math.round(onTime/graded*100):null, graded:graded };
  }
  function overallGrade(pid){
    var a=attStats(pid),g=gradeStats(pid),w=DB.w,wsum=0,acc=0;
    if(a.pct!=null){ acc+=a.pct*w.att; wsum+=w.att; }
    if(g.onTimePct!=null){ acc+=g.onTimePct*w.ontime; wsum+=w.ontime; }
    if(g.qPct!=null){ acc+=g.qPct*w.quality; wsum+=w.quality; }
    if(wsum===0) return { pct:null,num:null,att:a,gr:g };
    var pct=Math.round(acc/wsum), num=Math.round(pct/100*5*2)/2;
    if(num<1&&pct>0) num=1;
    return { pct:pct,num:num,att:a,gr:g };
  }
  function gradeWord(n){ if(n==null) return "Ei vielä arvioitu";
    if(n>=4.5) return "Erinomainen"; if(n>=3.5) return "Kiitettävä"; if(n>=2.5) return "Hyvä"; if(n>=1.5) return "Tyydyttävä"; return "Välttävä"; }
  function gradeColor(pct){ if(pct==null) return "#5A5347"; return pct>=80?"#5E8C5A":(pct>=50?"#BE8A2E":"#CE3F1B"); }

  // ============ RYHMÄ ============
  function viewGroup(){
    var s='<p class="lead">Ryhmälista ja luokkakuva. Jokaisen oma kuva muodostaa yhdessä luokkakuvan — tai lataa yksi yhteiskuva. Vain opettaja voi lisätä henkilöitä ja päättää roolin.</p>';
    if(TEACHER){
      s+='<div class="panel"><span class="kicker">Lisää henkilö</span><h3>Uusi ryhmään</h3><div class="inline">'
        + '<div class="field"><label>Nimi</label><input type="text" id="nName" placeholder="Etunimi Sukunimi"></div>'
        + '<div class="field"><label>Opiskelijatunnus</label><input type="text" id="nSid" placeholder="2600123"></div>'
        + '<div class="field" style="max-width:165px;"><label>Rooli</label><select id="nRole"><option value="opiskelija">Opiskelija</option><option value="henkilokunta">Henkilökunta</option></select></div>'
        + '<button class="btn primary" id="addP">Lisää</button></div>'
        + '<div class="field" style="margin-top:.7em;"><label>Ryhmän nimi</label><input type="text" id="gName" value="'+esc(DB.group)+'" placeholder="TXA26"></div>'
        + '<div class="btnrow"><button class="btn ghost" id="saveG">Tallenna ryhmän nimi</button>'
        + '<label class="btn ghost" style="cursor:pointer;">Lataa yhteiskuva<input type="file" id="gPhoto" accept="image/*" style="display:none;"></label>'
        + (DB.groupPhoto?'<button class="btn ghost" id="delGPhoto">Poista yhteiskuva</button>':'')+'</div></div>';
    }
    if(DB.groupPhoto){ s+='<div class="panel grouphoto"><span class="kicker">Luokkakuva</span><h3>'+(DB.group?esc(DB.group):"Ryhmä")+'</h3><img src="'+DB.groupPhoto+'" alt="Luokkakuva"></div>'; }
    s+='<div class="panel"><span class="kicker">Luokkakuva</span><h3>Ryhmä ('+DB.people.length+')</h3>';
    if(DB.people.length===0){ s+='<p class="lead" style="margin:0;">Ei henkilöitä. '+(TEACHER?"Lisää yltä tai lataa demoryhmä Asetuksista.":"Opettaja lisää ryhmän.")+'</p>'; }
    else{
      s+='<div class="classgrid">'; var i;
      for(i=0;i<DB.people.length;i++){ var p=DB.people[i];
        s+='<div class="pcard'+(p.role==="henkilokunta"?" staff":"")+'">'
          + (p.photo?'<img class="ph" src="'+p.photo+'" alt="'+esc(p.name)+'">':'<div class="noph">'+esc(initials(p.name))+'</div>')
          + '<div class="nm">'+esc(p.name)+'</div><div class="sid">'+esc(p.sid||"—")+'</div>'
          + '<span class="role '+p.role+'">'+(p.role==="opiskelija"?"Opiskelija":"Henkilökunta")+'</span>';
        if(p.role==="opiskelija"){ var iv=p.invite||"ei";
          s+='<br><span class="pill inv-'+iv+'">'+(iv==="ei"?"Ei kutsuttu":(iv==="kutsuttu"?"Kutsuttu":"Hyväksynyt"))+'</span>'; }
        if(TEACHER){ s+='<div class="acts">'

  function barChart(rows,label){
    var W=680,rowH=30,pad=180,H=rows.length*rowH+16;
    var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(label)+'">',i;
    for(i=0;i<rows.length;i++){ var y=i*rowH+14,w=Math.max(2,Math.round((W-pad-72)*(rows[i].pct/100)));
      var col=rows[i].pct>=80?"#5E8C5A":(rows[i].pct>=45?"#BE8A2E":"#CE3F1B");
      s+='<text x="0" y="'+(y+4)+'" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5A5347">'+esc(rows[i].label)+'</text>'
        + '<rect x="'+pad+'" y="'+(y-9)+'" width="'+(W-pad-72)+'" height="14" rx="7" fill="#D8D0C0"></rect>'
        + '<rect x="'+pad+'" y="'+(y-9)+'" width="'+w+'" height="14" rx="7" fill="'+col+'"></rect>'
        + '<text x="'+(W-64)+'" y="'+(y+4)+'" font-family="IBM Plex Mono, monospace" font-size="10" fill="#211C16">'+rows[i].pct+'% '+esc(rows[i].extra||"")+'</text>'; }
    return s+'</svg>';
  }
  function ring(pct){
    var r=52,c=2*Math.PI*r,on=c*(pct||0)/100;
    return '<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="Kokonaistilanne '+(pct||0)+' prosenttia">'
      + '<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="#D8D0C0" stroke-width="14"></circle>'
      + '<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="'+gradeColor(pct)+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+on.toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 70 70)"></circle>'
      + '<text x="70" y="78" text-anchor="middle" font-family="Big Shoulders Display, Arial, sans-serif" font-weight="800" font-size="32" fill="#211C16">'+(pct!=null?pct+"%":"–")+'</text></svg>';
  }
  function viewDash(){
    var st=students();
    if(st.length===0) return '<div class="panel"><p class="lead" style="margin:0;">Ei opiskelijoita. Avaa opettajan tila Asetuksista ja lataa demoryhmä, niin näet kaikki tasot.</p></div>';
    var i,j,totalCells=st.length*DB.tasks.length,doneCells=0;
    for(i=0;i<st.length;i++){ for(j=0;j<DB.tasks.length;j++){ if(DB.prog[st[i].id+":"+DB.tasks[j].id]==="valmis") doneCells++; } }
    var overall=totalCells?Math.round(doneCells/totalCells*100):0;
    var gsum=0,gn=0,attSum=0,attN=0,acc=0;
    for(i=0;i<st.length;i++){ var og=overallGrade(st[i].id);
      if(og.num!=null){ gsum+=og.num; gn++; }
      if(og.att.pct!=null){ attSum+=og.att.pct; attN++; }
      if((st[i].invite||"ei")==="hyvaksytty") acc++; }
    var avgGrade=gn?(gsum/gn):null,avgAtt=attN?Math.round(attSum/attN):null;

    var s='<div class="kpis">'
      + '<div class="kpi"><div class="k">Opiskelijoita</div><div class="v">'+st.length+'</div></div>'
      + '<div class="kpi"><div class="k">Kutsun hyväksyneet</div><div class="v">'+acc+' <small>/ '+st.length+'</small></div></div>'
      + '<div class="kpi"><div class="k">Läsnäolo</div><div class="v">'+(avgAtt!=null?avgAtt+"%":"–")+'</div></div>'
      + '<div class="kpi"><div class="k">Keskiarvo</div><div class="v" style="color:'+(avgGrade!=null?gradeColor(avgGrade/5*100):"#211C16")+'">'+(avgGrade!=null?avgGrade.toFixed(1):"–")+'</div></div></div>';
    s+='<div class="chart" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;"><div>'+ring(overall)+'</div>'

      + (overall>=80?"Kurssi on hyvässä vauhdissa.":(overall>=45?"Eteneminen käynnissä — seuraa jäljessä olevia.":"Alkuvaihe tai jäljessä."))+'</p></div></div>';

    var taskRows=[];
    for(j=0;j<DB.tasks.length;j++){ var n=0,qs=[];
      for(i=0;i<st.length;i++){ var k=st[i].id+":"+DB.tasks[j].id;
        if(DB.prog[k]==="valmis") n++;
        var g=DB.grade[k]; if(g&&g.q) qs.push(g.q); }
      var qa=qs.length?(qs.reduce(function(a,b){ return a+b; },0)/qs.length):null;
      taskRows.push({ label:DB.tasks[j].label, pct:st.length?Math.round(n/st.length*100):0, extra:"("+n+"/"+st.length+(qa?", taso "+qa.toFixed(1):"")+")" }); }
    s+='<div class="chart"><h4>Tehtävät — valmiit ja keskimääräinen taso</h4>'+barChart(taskRows,"Tehtävät")+'</div>';

    var phaseRows=[],ph;
    for(ph=0;ph<PHASES.length;ph++){
      var pt=DB.tasks.filter(function(x){ return x.phase===PHASES[ph].id; });
      if(pt.length===0) continue;
      var cells=st.length*pt.length,done=0;
      for(i=0;i<st.length;i++){ for(j=0;j<pt.length;j++){ if(DB.prog[st[i].id+":"+pt[j].id]==="valmis") done++; } }
      phaseRows.push({ label:PHASES[ph].id+" "+PHASES[ph].name, pct:cells?Math.round(done/cells*100):0, extra:"("+done+"/"+cells+")" });
    }
    s+='<div class="chart"><h4>Vaiheet — missä kurssi menee</h4>'+barChart(phaseRows,"Vaiheet")+'</div>';

    var stuRows=[];
    for(i=0;i<st.length;i++){ var o=overallGrade(st[i].id);
      stuRows.push({ label:st[i].name, pct:(o.pct!=null?o.pct:0), extra:(o.num!=null?"arvosana "+o.num.toFixed(1):"ei arvioitu") }); }
    stuRows.sort(function(a,b){ return a.pct-b.pct; });
    s+='<div class="chart"><h4>Opiskelijat — kokonaisarvio (heikoin ensin)</h4>'+barChart(stuRows,"Opiskelijat")+'</div>';

    s+='<div class="plain"><h4>Selkokielinen tilanne</h4><ul>';
    s+='<li class="'+(overall>=80?"ok":(overall>=45?"warn":"bad"))+'">Ryhmästä on valmiina '+overall+' % kaikista tehtävistä.</li>';
    if(acc<st.length) s+='<li class="'+(acc===0?"bad":"warn")+'">Kutsun on hyväksynyt '+acc+' / '+st.length+'. Muistuta hyväksymättömiä.</li>';
    else s+='<li class="ok">Kaikki ovat hyväksyneet kutsun.</li>';
    if(avgAtt!=null) s+='<li class="'+(avgAtt>=85?"ok":(avgAtt>=70?"warn":"bad"))+'">Läsnäolo on keskimäärin '+avgAtt+' %.</li>';
    if(avgGrade!=null) s+='<li class="'+(avgGrade>=3.5?"ok":(avgGrade>=2.5?"warn":"bad"))+'">Ryhmän arvosanojen keskiarvo on '+avgGrade.toFixed(1)+' ('+gradeWord(avgGrade).toLowerCase()+').</li>';
    var essMissing=[]; for(i=0;i<st.length;i++){ var e1=DB.essay[st[i].id+":t_osaaminen"],e2=DB.essay[st[i].id+":t_motivaatio"];
      if(!(e1&&e1.text)||!(e2&&e2.text)) essMissing.push(st[i].name); }
    if(essMissing.length===0) s+='<li class="ok">Kaikki ovat palauttaneet osaamisen tunnistus- ja motivaatioesseet.</li>';
    else s+='<li class="warn">Essee puuttuu '+essMissing.length+' opiskelijalta: '+esc(essMissing.slice(0,5).join(", "))+(essMissing.length>5?" ja muita":"")+'.</li>';
    var akMissing=[]; for(i=0;i<st.length;i++){ if(DB.prog[st[i].id+":t_ajokortti"]!=="valmis") akMissing.push(st[i].name); }
    if(akMissing.length===0) s+='<li class="ok">Kaikilla on paja-ajokortti.</li>';
    else s+='<li class="bad">Paja-ajokortti puuttuu '+akMissing.length+' opiskelijalta: '+esc(akMissing.slice(0,5).join(", "))+(akMissing.length>5?" ja muita":"")+'. Ilman sitä ei työskennellä koneilla.</li>';
    var weak=stuRows.filter(function(r){ return r.pct>0&&r.pct<50; });
    if(weak.length>0) s+='<li class="warn">Tukea tarvitsevat: '+esc(weak.map(function(r){ return r.label; }).slice(0,6).join(", "))+'.</li>';
    var late=[]; for(i=0;i<st.length;i++){ var lg=gradeStats(st[i].id); if(lg.onTimePct!=null&&lg.onTimePct<70) late.push(st[i].name); }
    if(late.length>0) s+='<li class="warn">Palautukset toistuvasti myöhässä: '+esc(late.slice(0,6).join(", "))+'.</li>';
    var absent=[]; for(i=0;i<st.length;i++){ var miss=0; for(j=0;j<DB.days.length;j++){ if(DB.att[st[i].id+":"+DB.days[j].date]==="poissa") miss++; } if(miss>=2) absent.push(st[i].name+" ("+miss+" pv)"); }
    if(absent.length>0) s+='<li class="bad">Paljon poissaoloja: '+esc(absent.slice(0,5).join(", "))+'.</li>';
    return s+'</ul></div>';
  }

  function download(text,name,mime){
    try{ var b=new Blob([text],{type:mime}),u=URL.createObjectURL(b),a=document.createElement("a");
      a.href=u; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(u); },1000); }
    catch(e){ flash("Lataus ei onnistunut.","err"); }
  }
  function cc(s){ return String(s==null?"":s).replace(/;/g," ").replace(/[\r\n]+/g," "); }
  function exportAtt(){
    var st=students(),rows=[],i,j,head=["Nimi","Opiskelijatunnus"];
    for(j=0;j<DB.days.length;j++){ head.push(DB.days[j].label||DB.days[j].date); }
    head.push("Lasna-%"); rows.push(head.join(";"));
    for(i=0;i<st.length;i++){ var r=[cc(st[i].name),cc(st[i].sid)];
      for(j=0;j<DB.days.length;j++){ r.push(ATT_LABEL[DB.att[st[i].id+":"+DB.days[j].date]||""]); }
      var a=attStats(st[i].id); r.push(a.pct!=null?a.pct+"%":""); rows.push(r.join(";")); }
    download("\ufeff"+rows.join("\r\n"),"lasnaolo.csv","text/csv;charset=utf-8");
  }
  function exportGrades(){
    var st=students(),rows=[],i,j,head=["Nimi","Opiskelijatunnus"];
    for(j=0;j<DB.tasks.length;j++){ head.push(DB.tasks[j].label+" tila"); head.push(DB.tasks[j].label+" taso"); head.push(DB.tasks[j].label+" palautus"); }
    head.push("Lasnaolo-%"); head.push("Ajallaan-%"); head.push("Taso-%"); head.push("Arvosana"); rows.push(head.join(";"));
    for(i=0;i<st.length;i++){ var r=[cc(st[i].name),cc(st[i].sid)];
      for(j=0;j<DB.tasks.length;j++){ var k=st[i].id+":"+DB.tasks[j].id,g=DB.grade[k]||{};
        r.push(PROG_LABEL[DB.prog[k]||""]); r.push(g.q||""); r.push(g.ontime===false?"myohassa":(g.ontime===true?"ajoissa":"")); }
      var o=overallGrade(st[i].id);
      r.push(o.att.pct!=null?o.att.pct:""); r.push(o.gr.onTimePct!=null?o.gr.onTimePct:""); r.push(o.gr.qPct!=null?o.gr.qPct:"");
      r.push(o.num!=null?String(o.num).replace(".",","):""); rows.push(r.join(";")); }
    download("\ufeff"+rows.join("\r\n"),"arvioinnit.csv","text/csv;charset=utf-8");
  }

  // ============ ROUTER ============
  var TABS=[
    { id:"tilanne",   label:"Tilanne",  render:viewDash,    bind:null },
    { id:"ryhma",     label:"Ryhmä & luokkakuva", render:viewGroup, bind:bindGroup },
    { id:"kutsut",    label:"Kutsut",   render:viewInvites, bind:bindInvites },
    { id:"lasnaolo",  label:"Läsnäolo", render:viewAtt,     bind:bindAtt },
    { id:"tehtavat",  label:"Tehtävät & arviointi", render:viewTasks, bind:bindTasks },
    { id:"esseet",    label:"Esseet",   render:viewEssays,  bind:null },
    { id:"opiskelija",label:"Opiskelijan näkymä", render:viewStudent, bind:bindStudent },
    { id:"asetukset", label:"Asetukset", render:viewSettings, bind:bindSettings }
  ];

  function render(){
    var el=document.getElementById("tabs"),s="",i;
    for(i=0;i<TABS.length;i++){ s+='<button class="tab'+(TABS[i].id===current?" active":"")+'" data-tab="'+TABS[i].id+'">'+TABS[i].label+'</button>'; }
    el.innerHTML=s;
    el.querySelectorAll("[data-tab]").forEach(function(b){ b.addEventListener("click", function(){ current=b.getAttribute("data-tab"); flashMsg=null; render(); }); });
    var badge=document.getElementById("modeBadge");
    badge.className="modebadge "+(TEACHER?"on":"off"); badge.textContent=TEACHER?"Opettajan tila":"Katselutila";
    var t=null; for(i=0;i<TABS.length;i++){ if(TABS[i].id===current) t=TABS[i]; }
    var html=t.render();
    if(flashMsg){ html='<div class="msg '+flashMsg.k+'">'+esc(flashMsg.t)+'</div>'+html; flashMsg=null; }
    document.getElementById("view").innerHTML=html;
    if(t.bind) t.bind();
    document.getElementById("note").innerHTML =
      "Pilotti: tiedot vain tässä selaimessa — ota varmuuskopio Asetuksista. "
      + "Nimet, opiskelijatunnukset, sähköpostit ja kuvat ovat henkilötietoa: säilytä varmuuskopiot Metropolian ympäristössä ja pyydä kuviin suostumus. "
      + "Tunnusluku on käyttöliittymän suoja, ei tietoturva. Arvosana on ohjaava työkalu — virallinen arviointi tehdään Metropolian omassa järjestelmässä.";
  }

  load(); render();
})();
</script>
