<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kemikaalit — Metropolian kemikaalienhallinta</title>
<meta name="theme-color" content="#CE3F1B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="mhks-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#ECE6DA;--paper-deep:#E4DCCC;--card:#F3EFE7;--ink:#211C16;--ink-soft:#5A5347;
    --ember:#CE3F1B;--rule:#C8BFAD;--rule-soft:#D8D0C0;--vihrea:#5E8C5A;--laatu:#BE8A2E;--steel:#3D4B58;--oikeus:#4F6E92;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Spectral",Georgia,serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 clamp(12px,3vw,26px) 60px;}
  h1,h2,h3,h4,h5{font-family:"Big Shoulders Display",Arial,sans-serif;font-weight:800;text-transform:uppercase;line-height:.95;margin:0;}
  .mono{font-family:"IBM Plex Mono",monospace;}
  p{margin:0 0 1em;}
  .head{padding:clamp(20px,4vw,32px) 0 8px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;}
  .head h1{font-size:clamp(1.8rem,5vw,2.8rem);}
  .head h1 .e{color:var(--ember);}
  .head p{color:var(--ink-soft);font-size:.92rem;max-width:66ch;margin:.4em 0 0;}
  /* Roolinvaihto — aina näkyvissä */
  .roleswitch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--rule);
    border-radius:24px;padding:4px 5px;}
  .rs{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.04em;text-transform:uppercase;
    cursor:pointer;border:none;background:transparent;color:var(--ink-soft);padding:.5em .9em;border-radius:20px;}
  .rs:hover{color:var(--ink);}
  .rs.on{background:var(--ink);color:var(--paper);}
  .rs.on.staff{background:var(--ember);}
  .rs .ic{margin-right:.35em;}

  /* Herätteet */
  .alertbar{background:rgba(190,138,46,.16);border:1px solid var(--laatu);border-radius:8px;
    padding:11px 14px;margin:0 0 14px;font-size:.9rem;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .alertbar.crit{background:rgba(206,63,27,.1);border-color:var(--ember);}
  .alertbar .ai{font-family:"Big Shoulders Display",Arial,sans-serif;font-weight:800;font-size:1.5rem;line-height:1;flex:none;}
  .alertbar .at{flex:1;min-width:220px;}
  .alertbar b{display:block;}

  /* Tuontitavat */
  .methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:14px;}
  .method{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--steel);border-radius:9px;
    padding:13px 14px;cursor:pointer;}
  .method:hover{border-color:var(--ink-soft);}
  .method.sel{border-left-color:var(--ember);box-shadow:0 0 0 1px var(--ember);}
  .method h4{font-size:1.05rem;margin-bottom:.2em;}
  .method .d{font-size:.83rem;color:var(--ink-soft);line-height:1.35;}
  .method .tag{font-family:"IBM Plex Mono",monospace;font-size:.52rem;letter-spacing:.05em;text-transform:uppercase;
    background:var(--paper-deep);color:var(--ink-soft);padding:.16em .45em;border-radius:20px;display:inline-block;margin-top:.4em;}

  .drop{border:2px dashed var(--rule);border-radius:10px;padding:22px 16px;text-align:center;background:#fff;}
  .drop.over{border-color:var(--ember);background:rgba(206,63,27,.05);}
  .drop .big{font-family:"Big Shoulders Display",Arial,sans-serif;font-weight:800;font-size:1.2rem;text-transform:uppercase;}
  .drop .sm{font-size:.85rem;color:var(--ink-soft);margin-top:.3em;}

  .queue{margin-top:12px;}
  .qitem{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:11px 13px;margin-bottom:8px;}
  .qitem .qh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;}
  .qitem .qn{font-family:"Big Shoulders Display",Arial,sans-serif;font-weight:700;text-transform:uppercase;font-size:1rem;}
  .qitem .qs{font-family:"IBM Plex Mono",monospace;font-size:.58rem;color:var(--ink-soft);}
  .bar{height:6px;background:var(--rule-soft);border-radius:4px;overflow:hidden;margin-top:.4em;}
  .bar i{display:block;height:100%;background:var(--ember);transition:width .3s ease;}
  .found{font-family:"IBM Plex Mono",monospace;font-size:.62rem;color:var(--vihrea);margin-top:.3em;}
  .notfound{color:var(--ember);}

  .tabs{position:sticky;top:64px;z-index:20;background:var(--paper);display:flex;gap:4px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--rule);}
  .tab{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;cursor:pointer;border:1px solid var(--rule);background:var(--card);color:var(--ink-soft);padding:.55em .8em;border-radius:20px;flex:none;}
  .tab:hover{border-color:var(--ink-soft);color:var(--ink);}
  .tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .tab .n{background:var(--ember);color:#fff;border-radius:20px;padding:0 .4em;margin-left:.3em;font-size:.9em;}

  .view{padding-top:16px;}
  .lead{color:var(--ink-soft);font-size:.92rem;max-width:74ch;margin:0 0 14px;}
  .panel{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:13px 15px;margin-bottom:13px;}
  .panel h3{font-size:1.12rem;margin-bottom:.4em;}
  .kicker{font-family:"IBM Plex Mono",monospace;font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ember);font-weight:600;display:block;margin-bottom:.2em;}

  .btn{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:.5em .82em;border-radius:3px;}
  .btn:hover{background:var(--ink);color:var(--paper);}
  .btn.primary{background:var(--ember);border-color:var(--ember);color:#fff;}
  .btn.primary:hover{background:#b0340f;}
  .btn.ok{background:var(--vihrea);border-color:var(--vihrea);color:#fff;}
  .btn.ghost{border-color:var(--rule);color:var(--ink-soft);}
  .btn.mini{font-size:.54rem;padding:.3em .55em;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btnrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}

  .field{margin:.45em 0;}
  .field label{display:block;font-family:"IBM Plex Mono",monospace;font-size:.56rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:.2em;}
  .field label .req{color:var(--ember);}
  .field input,.field select,.field textarea{width:100%;font-family:"Spectral",serif;font-size:.94rem;padding:.45em .55em;border:1px solid var(--rule);border-radius:4px;background:#fff;color:var(--ink);}
  .field textarea{resize:vertical;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--ember);border-color:var(--ember);}
  .inline{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;}
  .inline .field{flex:1;min-width:150px;margin:0;}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px;margin-bottom:13px;}
  .kpi{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:11px 13px;}
  .kpi .k{font-family:"IBM Plex Mono",monospace;font-size:.53rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);}
  .kpi .v{font-family:"Big Shoulders Display",Arial,sans-serif;font-weight:800;font-size:1.85rem;line-height:1;margin-top:.1em;}

  .clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;}
  .ccard{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--steel);border-radius:8px;padding:12px 13px;cursor:pointer;}
  .ccard:hover{border-color:var(--ink-soft);}
  .ccard.r4,.ccard.r5{border-left-color:var(--ember);}
  .ccard.r3{border-left-color:var(--laatu);}
  .ccard.r1,.ccard.r2{border-left-color:var(--vihrea);}
  .ccard.poistettu{opacity:.6;border-left-color:var(--ink-soft);background:var(--paper-deep);}
  .ccard h4{font-size:1.02rem;line-height:1.05;}
  .ccard .sup{font-family:"IBM Plex Mono",monospace;font-size:.55rem;color:var(--ink-soft);margin-top:.15em;}
  .ccard .loc{font-size:.8rem;color:var(--ink-soft);margin-top:.35em;}

  .pill{font-family:"IBM Plex Mono",monospace;font-size:.5rem;letter-spacing:.05em;text-transform:uppercase;padding:.18em .45em;border-radius:20px;display:inline-block;margin:.12em .2em .12em 0;}
  .s-ehdotus{background:rgba(190,138,46,.25);color:#7a5a12;}
  .s-hyvaksytty{background:rgba(94,140,90,.22);color:#3c5e39;}
  .s-hylatty{background:rgba(206,63,27,.16);color:#8f2a10;}
  .s-poistettu{background:var(--paper-deep);color:var(--ink-soft);border:1px solid var(--rule);}
  .p-ghs{background:#fff;color:#8f2a10;border:1px solid var(--ember);}
  .p-ppe{background:var(--paper-deep);color:var(--ink);border:1px solid var(--rule);}
  .p-asa{background:var(--ember);color:#fff;}
  .p-pro{background:rgba(79,110,146,.2);color:#33506e;}
  .risk{font-family:"IBM Plex Mono",monospace;font-size:.6rem;color:var(--ink-soft);display:inline-flex;align-items:center;gap:5px;margin-top:.3em;}
  .risk .b{letter-spacing:-1px;}
  .risk .on{color:var(--ember);}.risk .off{color:var(--rule);}

  .detail{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:16px 18px;margin-bottom:14px;}
  .detail h3{font-size:1.45rem;}
  .drow{padding:.45em 0;border-top:1px dashed var(--rule);font-size:.92rem;}
  .drow .dl{font-family:"IBM Plex Mono",monospace;font-size:.55rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:.12em;}
  .warnbox{background:rgba(206,63,27,.1);border-left:4px solid var(--ember);border-radius:4px;padding:.6em .8em;font-size:.88rem;margin:.6em 0;}
  .okbox{background:rgba(94,140,90,.12);border-left:4px solid var(--vihrea);border-radius:4px;padding:.6em .8em;font-size:.88rem;margin:.6em 0;}
  .infobox{background:var(--paper-deep);border-left:4px solid var(--steel);border-radius:4px;padding:.6em .8em;font-size:.88rem;margin:.6em 0;}

  .chk{list-style:none;margin:.4em 0;padding:0;}
  .chk li{padding:.28em 0;font-size:.88rem;display:flex;gap:8px;align-items:flex-start;}
  .chk .m{font-family:"IBM Plex Mono",monospace;font-weight:600;flex:none;width:1.2em;}
  .chk li.ok .m{color:var(--vihrea);}
  .chk li.no .m{color:var(--ember);}
  .chk li.no{color:#8f2a10;}

  .tblwrap{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;font-size:.83rem;}
  th,td{border-bottom:1px solid var(--rule);padding:.4em .5em;text-align:left;vertical-align:top;}
  th{font-family:"IBM Plex Mono",monospace;font-size:.53rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);}
  code{font-family:"IBM Plex Mono",monospace;font-size:.85em;background:#fff;border:1px solid var(--rule);border-radius:3px;padding:.05em .35em;}

  .msg{font-size:.85rem;padding:.5em .7em;border-radius:4px;margin:.5em 0;}
  .msg.ok{background:rgba(94,140,90,.12);border-left:3px solid var(--vihrea);color:#3c5e39;}
  .msg.err{background:rgba(206,63,27,.1);border-left:3px solid var(--ember);color:#8f2a10;}
  .msg.info{background:var(--paper-deep);border-left:3px solid var(--steel);color:var(--ink-soft);}
  .note{font-family:"IBM Plex Mono",monospace;font-size:.6rem;color:var(--ink-soft);line-height:1.7;margin-top:14px;border-top:1px solid var(--rule);padding-top:9px;}

  @media print{
    .tabs,.btnrow,.btn,.note,.head p,.modebadge{display:none !important;}
    body{background:#fff;} .panel{border:none;background:#fff;}
    table{font-size:11px;} th,td{border-bottom:1px solid #999;}
  }
</style>
</head>

<script src="paja-data.js"></script>
<script>
(function(){
  if(window.PAJA) return;
  document.addEventListener("DOMContentLoaded", function(){
    var d=document.createElement("div");
    d.setAttribute("role","alert");
    d.style.cssText="position:sticky;top:0;z-index:9999;background:#CE3F1B;color:#fff;padding:12px 16px;font-family:monospace;font-size:.78rem;line-height:1.6;";
    d.innerHTML="<b>Tietolähde puuttuu.</b> Tiedosto paja-data.js ei latautunut. Tilat ja suojaimet eivät näy. Varmista että tiedostot ovat samassa kansiossa.";
    document.body.insertBefore(d, document.body.firstChild);
  });
})();
</script>
<script src="pajakuutio-nav.js"></script>
<div class="wrap">

  <header class="head">
    <div>
      <h1>Kemi<span class="e">kaalit</span></h1>
      <p>Metropolian kemikaalienhallinta. Ainetta ei saa käyttää ilman varoitusmerkintöjä ja käyttöturvallisuustiedotetta.</p>
    </div>
    <div class="roleswitch" id="roleSwitch"></div>
  </header>
  <div id="alerts"></div>

  <nav class="tabs" id="tabs"></nav>
  <main class="view" id="view"></main>
  <div class="note" id="note"></div>
</div>

<script>
(function(){
  "use strict";
  var KEY="metropolia_kemikaalit_v1";
  var STAFF=false, current="selaa", openId="", q="", roomF="", statusF="hyvaksytty";
  var importRows=null;

  function rooms(){ return (window.PAJA?PAJA.roomNames():[]); }
  function ppeList(){ return (window.PAJA?PAJA.ppe():[]); }
  function campuses(){ return (window.PAJA?PAJA.campuses():[{code:"ARA",name:"Arabia"}]); }
  function curCampus(){ return (window.PAJA?PAJA.getCampus():"ARA"); }

  var GHS=[
    {c:"GHS01",t:"Räjähtävä"},{c:"GHS02",t:"Syttyvä"},{c:"GHS03",t:"Hapettava"},
    {c:"GHS04",t:"Paineen alainen kaasu"},{c:"GHS05",t:"Syövyttävä"},{c:"GHS06",t:"Myrkyllinen"},
    {c:"GHS07",t:"Ärsyttävä"},{c:"GHS08",t:"Terveysvaara"},{c:"GHS09",t:"Ympäristövaara"}
  ];
  var STATUS={ehdotus:"Ehdotus",hyvaksytty:"Hyväksytty",hylatty:"Hylätty",poistettu:"Poistettu"};

  var DB={items:[],log:[],pin:"",sync:{endpoint:"",apiKey:""}};
  function load(){ try{ var s=localStorage.getItem(KEY); if(s){ var d=JSON.parse(s);
    DB.items=d.items||[]; DB.log=d.log||[]; DB.pin=d.pin||""; DB.sync=d.sync||{endpoint:"",apiKey:""}; } }catch(e){} }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); return true; }catch(e){ flash("Tallennus ei onnistunut.","err"); return false; } }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function nowISO(){ return new Date().toISOString(); }
  function fmt(iso){ if(!iso) return "–"; var d=new Date(iso); function p(n){return (n<10?"0":"")+n;}
    return d.getDate()+"."+(d.getMonth()+1)+"."+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes()); }
  function fmtD(v){ if(!v) return "–"; var p=String(v).split("-"); if(p.length<3) return v;
    return parseInt(p[2],10)+"."+parseInt(p[1],10)+"."+p[0]; }
  function uid(){ return "k"+Math.random().toString(36).slice(2,8); }
  function yearsSince(d){ if(!d) return null; var t=new Date(d).getTime(); if(isNaN(t)) return null; return (Date.now()-t)/(365.25*24*3600000); }
  function logAdd(kind,ref,text,by){ DB.log.push({ts:nowISO(),kind:kind,ref:ref,text:text,by:by||""}); }
  function byId(id){ var a=DB.items.filter(function(x){ return x.id===id; }); return a.length?a[0]:null; }
  var flashMsg=null;
  function flash(t,k){ flashMsg={t:t,k:k}; render(); }

  /* -------- LIITEPAKKO: mitä vaaditaan ennen hyväksyntää -------- */
  var REQUIRED=[
    {k:"sds",   label:"Käyttöturvallisuustiedote (linkki tai tiedosto)", test:function(c){ return !!(c.sdsUrl||c.sdsFile); },
     law:"VNa 715/2001 — ainetta ei saa käyttää ilman KTT:tä"},
    {k:"sdsDate",label:"Käyttöturvallisuustiedotteen päiväys", test:function(c){ return !!c.sdsDate; },
     law:"Luettelosta on käytävä ilmi KTT:n päiväys"},
    {k:"h",     label:"Vaaralausekkeet (H)", test:function(c){ return !!(c.h&&String(c.h).trim()); },
     law:"Luokitustiedot on ilmoitettava"},
    {k:"ghs",   label:"Varoitusmerkit (GHS)", test:function(c){ return !!(c.ghs&&String(c.ghs).trim()); },
     law:"Varoitusmerkinnät oltava"},
    {k:"ppe",   label:"Vaadittavat suojaimet", test:function(c){ return !!(c.ppe&&String(c.ppe).trim()); },
     law:"Altistumisen vähentäminen"},
    {k:"store", label:"Säilytyspaikka", test:function(c){ return !!(c.storeLoc&&String(c.storeLoc).trim()); },
     law:"Luettelo oltava saatavilla kemikaalivarastossa"},
    {k:"use",   label:"Käyttöpaikka", test:function(c){ return !!(c.useLoc&&String(c.useLoc).trim()); },
     law:"Tilakohtainen luettelo pelastussuunnitelmaan"},
    {k:"disp",  label:"Hävitysohje", test:function(c){ return !!(c.disposal&&String(c.disposal).trim()); },
     law:"Asianmukainen jätehuolto"}
  ];
  function missing(c){ return REQUIRED.filter(function(r){ return !r.test(c); }); }
  function complete(c){ return missing(c).length===0; }
  function completeness(c){ return Math.round((REQUIRED.length-missing(c).length)/REQUIRED.length*100); }

  function riskBlocks(n){
    var on="",off="",i; n=n||1;
    for(i=0;i<n;i++) on+="■"; for(i=n;i<5;i++) off+="■";
    return '<span class="risk"><span class="b"><span class="on">'+on+'</span><span class="off">'+off+'</span></span>riski '+n+' / 5</span>';
  }
  function inUse(){ return DB.items.filter(function(c){ return c.status==="hyvaksytty"; }); }
  function pending(){ return DB.items.filter(function(c){ return c.status==="ehdotus"; }); }

  // ================= SELAA =================
  function viewBrowse(){
    if(openId){ var c=byId(openId); if(c) return detailHTML(c)+'<div class="btnrow"><button class="btn ghost" id="closeD">Takaisin</button></div>'; }
    var use=inUse(), stale=0, i;
    for(i=0;i<use.length;i++){ var y=yearsSince(use[i].sdsDate); if(y!=null&&y>3) stale++; }
    var s='<div class="kpis">'
      + '<div class="kpi"><div class="k">Käytössä</div><div class="v">'+use.length+'</div></div>'
      + '<div class="kpi"><div class="k">Odottaa hyväksyntää</div><div class="v" style="color:'+(pending().length?"var(--ember)":"var(--ink)")+'">'+pending().length+'</div></div>'
      + '<div class="kpi"><div class="k">Poistettu</div><div class="v">'+DB.items.filter(function(x){return x.status==="poistettu";}).length+'</div></div>'
      + '<div class="kpi"><div class="k">KTT yli 3 v</div><div class="v" style="color:'+(stale?"var(--laatu)":"var(--ink)")+'">'+stale+'</div></div>'
      + '<div class="kpi"><div class="k">ASA-seuranta</div><div class="v">'+use.filter(function(x){return x.asa;}).length+'</div></div></div>';

    var ro='<option value="">Kaikki tilat</option>';
    var rl=rooms(); for(i=0;i<rl.length;i++){ ro+='<option value="'+esc(rl[i])+'"'+(roomF===rl[i]?" selected":"")+'>'+esc(rl[i])+'</option>'; }
    var so="",k,ST=[["hyvaksytty","Käytössä"],["ehdotus","Odottaa"],["hylatty","Hylätty"],["poistettu","Poistettu"],["","Kaikki"]];
    for(i=0;i<ST.length;i++){ so+='<option value="'+ST[i][0]+'"'+(statusF===ST[i][0]?" selected":"")+'>'+ST[i][1]+'</option>'; }
    s+='<div class="panel"><div class="inline">'
      + '<div class="field"><label>Hae</label><input type="text" id="fq" value="'+esc(q)+'" placeholder="Kauppanimi tai toimittaja"></div>'
      + '<div class="field"><label>Käyttöpaikka</label><select id="fr">'+ro+'</select></div>'
      + '<div class="field" style="max-width:170px;"><label>Tila</label><select id="fs">'+so+'</select></div>'
      + '<button class="btn ghost" id="fc">Tyhjennä</button></div></div>';

    var ql=q.toLowerCase();
    var vis=DB.items.filter(function(c){
      if(statusF && c.status!==statusF) return false;
      if(roomF && String(c.useLoc).indexOf(roomF)===-1) return false;
      if(ql && (c.name+" "+(c.supplier||"")).toLowerCase().indexOf(ql)===-1) return false;
      return true;
    });
    if(vis.length===0) return s+'<div class="panel"><p class="lead" style="margin:0;">Ei osumia. '+(STAFF?"Tuo aineita PRO24-välilehdeltä.":"Jos tarvitsemaasi ainetta ei ole, tee ehdotus.")+'</p></div>';

    s+='<div class="clist">';
    for(i=0;i<vis.length;i++){ var cc=vis[i];

  function loadScript(url){
    return new Promise(function(res,rej){
      var s=document.createElement("script"); s.src=url;

  function extractFields(text,q){
    var f={};
    // H- ja P-lausekkeet ovat standardikoodeja — nämä tunnistuvat luotettavasti
    var hs=text.match(/\bH\d{3}[A-Za-z]{0,2}\b/g);
    if(hs){ var u={},o=[],i; for(i=0;i<hs.length;i++){ if(!u[hs[i]]){ u[hs[i]]=1; o.push(hs[i]); } }
      q.h=o.sort().join(", "); f.h=true; }
    var ps=text.match(/\bP\d{3}(?:\s*\+\s*P\d{3})*\b/g);
    if(ps){ var u2={},o2=[],j; for(j=0;j<ps.length;j++){ var k=ps[j].replace(/\s+/g,""); if(!u2[k]){ u2[k]=1; o2.push(k); } }
      q.pStat=o2.sort().join(", "); f.p=true; }
    var gs=text.match(/\bGHS0[1-9]\b/g);
    if(gs){ var u3={},o3=[],m; for(m=0;m<gs.length;m++){ if(!u3[gs[m]]){ u3[gs[m]]=1; o3.push(gs[m]); } }
      q.ghs=o3.sort().join(", "); f.ghs=true; }
    // Päiväys
    var dm=text.match(/(?:tarkistettu|p[äa]iv[äa]ys|revision|version|laadittu|muutettu)[^\n]{0,40}?(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/i);
    if(!dm) dm=text.match(/(\d{4})-(\d{2})-(\d{2})/);
    if(dm){
      if(dm.length===4 && dm[3] && String(dm[3]).length===4){
        q.sdsDate=dm[3]+"-"+("0"+dm[2]).slice(-2)+"-"+("0"+dm[1]).slice(-2);
      } else if(dm[1] && String(dm[1]).length===4){ q.sdsDate=dm[1]+"-"+dm[2]+"-"+dm[3]; }
      if(q.sdsDate) f.date=true;
    }
    // Kauppanimi: kohta 1.1
    var nm=text.match(/1\.1[^\n]{0,60}?(?:tunniste|nimi|identifier|product)[^\n]{0,20}[\n:]\s*([^\n]{3,80})/i);
    if(nm && nm[1]){ q.name=nm[1].trim().replace(/^[:\-\s]+/,""); f.name=true; }
    // Toimittaja: kohta 1.3
    var sp=text.match(/1\.3[^\n]{0,80}?[\n:]\s*([^\n]{3,80})/i);
    if(sp && sp[1]){ var cand=sp[1].trim().replace(/^[:\-\s]+/,"");
      if(cand.length>2 && !/^\d/.test(cand)){ q.supplier=cand; f.supplier=true; } }
    q.found=f;
    return q;
  }
  function readPdf(file,q,done){
    q.progress=5; renderAddOnly();
    var p = libs.pdf ? Promise.resolve()
      : loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js").then(function(){ libs.pdf=true; });
    p.then(function(){
      var lib=window.pdfjsLib;
      if(!lib) throw new Error("PDF-kirjastoa ei saatu ladattua");
      lib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      var fr=new FileReader();
      fr.onload=function(){
        lib.getDocument({data:new Uint8Array(fr.result)}).promise.then(function(pdf){
          q.pages=pdf.numPages;
          var text="", n=Math.min(pdf.numPages,6), i=1;
          function next(){
            if(i>n){ 
              if(text.trim().length<40){ q.error="PDF ei sisällä luettavaa tekstiä — se on todennäköisesti skannattu kuva. Käytä kuvatuontia tai täytä käsin."; }
              else { extractFields(text,q); }
              q.progress=100; done(); return;
            }
            pdf.getPage(i).then(function(pg){ return pg.getTextContent(); }).then(function(tc){
              text += tc.items.map(function(x){ return x.str; }).join(" ")+"\n";
              q.progress=Math.round(5+(i/n)*90); renderAddOnly(); i++; next();
            }).catch(function(){ i++; next(); });
          }
          next();
        }).catch(function(){ q.error="PDF:n luku ei onnistunut."; q.progress=100; done(); });
      };
      fr.readAsArrayBuffer(file);
    }).catch(function(){
      q.error="Kirjastoa ei saatu ladattua. Tarkista verkkoyhteys tai täytä tiedot käsin.";
      q.progress=100; done();
    });
  }
  function readImage(file,q,done){
    q.progress=5; renderAddOnly();
    var p = libs.ocr ? Promise.resolve()
      : loadScript("https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js").then(function(){ libs.ocr=true; });
    p.then(function(){
      if(!window.Tesseract) throw new Error("OCR-kirjastoa ei saatu");
      return window.Tesseract.recognize(file,"fin+eng",{ logger:function(m){
        if(m.status==="recognizing text"){ q.progress=Math.round(10+m.progress*85); renderAddOnly(); } } });
    }).then(function(r){
      var txt=(r&&r.data&&r.data.text)||"";
      if(txt.trim().length<20) q.error="Kuvasta ei saatu luettavaa tekstiä. Ota tarkempi kuva tai täytä käsin.";
      else extractFields(txt,q);
      q.progress=100; done();
    }).catch(function(){
      q.error="Tekstintunnistus ei onnistunut. Tarkista verkkoyhteys tai täytä tiedot käsin.";
      q.progress=100; done();
    });
  }
  function handleFiles(files){
    var i;
    for(i=0;i<files.length;i++){
      (function(file){
        var q={ fileName:file.name, name:"", supplier:"", h:"", pStat:"", ghs:"", ppe:"", sdsDate:"",
                storeLoc:"", useLoc:"", disposal:"", sdsUrl:"", sdsFile:file.name, risk:3, found:{}, progress:0 };
        queue.push(q);

        if(/\.pdf$/i.test(file.name)) readPdf(file,q,done);
        else readImage(file,q,done);
      })(files[i]);
    }
    renderAddOnly();
  }

  function parseTable(raw){
    var lines=raw.split(/\r?\n/).filter(function(x){ return x.trim().length>0; });
    if(lines.length<2) return null;
    var sep=(lines[0].indexOf(";")!==-1)?";":((lines[0].indexOf("\t")!==-1)?"\t":",");
    var head=lines[0].split(sep).map(function(x){ return x.trim().toLowerCase().replace(/^"|"$/g,""); });
    function col(names){ var i,j; for(j=0;j<names.length;j++){ for(i=0;i<head.length;i++){ if(head[i].indexOf(names[j])!==-1) return i; } } return -1; }
    var ci={ name:col(["kauppanimi","nimi","tuote","tradename"]), sup:col(["toimittaja","valmistaja","supplier"]),
      h:col(["h-lause","hlause","vaaralause","hstat"]), pStat:col(["p-lause","plause","turvalause"]),
      ghs:col(["ghs","piktog","varoitusmerk"]), url:col(["ktt-linkki","linkki","url","tiedote","sds"]),
      date:col(["ktt-pv","pvm","päiväys","paivays","date"]), store:col(["säilytys","sailytys","varasto","storage"]),
      use:col(["käyttöpaikka","kayttopaikka","tila","paja","location"]), ppe:col(["suojain","suojaimet","ppe"]),
      usefor:col(["käyttötark","kayttotark","tarkoitus","purpose"]), disp:col(["hävit","havit","jäte","jate","disposal"]),
      amount:col(["määrä","maara","amount","quantity"]), risk:col(["riski","vaara","risk"]), asa:col(["asa"]),
      pid:col(["pro24","tunnus","id"]) };
    if(ci.name===-1) return {error:"Kauppanimi-saraketta ei löytynyt otsikoista."};
    var rows=[],i;
    for(i=1;i<lines.length;i++){
      var cells=lines[i].split(sep);
      function v(idx){ return (idx>=0&&cells[idx]!=null)?String(cells[idx]).trim().replace(/^"|"$/g,""):""; }
      var nm=v(ci.name); if(!nm) continue;
      var rk=parseInt(v(ci.risk),10); if(isNaN(rk)||rk<1||rk>5) rk=3;
      var asav=v(ci.asa).toLowerCase();
      rows.push({ name:nm, supplier:v(ci.sup), h:v(ci.h), pStat:v(ci.pStat), ghs:v(ci.ghs),
        sdsUrl:v(ci.url), sdsDate:v(ci.date), storeLoc:v(ci.store), useLoc:v(ci.use), ppe:v(ci.ppe),
        use:v(ci.usefor), disposal:v(ci.disp), amount:v(ci.amount), risk:rk,
        asa:(asav==="kyllä"||asav==="kylla"||asav==="x"||asav==="1"||asav==="true"),
        pro24Id:v(ci.pid) });
    }
    return {rows:rows};
  }
  function isDuplicate(r){
    return DB.items.some(function(c){
      return c.name.toLowerCase()===r.name.toLowerCase()
        && String(c.supplier||"").toLowerCase()===String(r.supplier||"").toLowerCase()
        && c.status!=="poistettu";
    });
  }
  function bindTableImport(){
    var pv=document.getElementById("impPrev");
    if(pv){ pv.addEventListener("click", function(){
      var res=parseTable(document.getElementById("imp").value);
      var out=document.getElementById("impOut");
      if(!res){ out.innerHTML='<div class="msg err">Liitä otsikkorivi ja vähintään yksi ainerivi.</div>'; return; }
      if(res.error){ out.innerHTML='<div class="msg err">'+esc(res.error)+'</div>'; return; }
      importRows=res.rows;
      var dups=res.rows.filter(isDuplicate).length;
      var incomplete=res.rows.filter(function(r){ return missing(r).length>0; }).length;
      var s='<div class="msg '+(dups?"info":"ok")+'">Tunnistettu <b>'+res.rows.length+'</b> ainetta. '
        + (dups?'<b>'+dups+'</b> on jo rekisterissä (ohitetaan). ':'')
        + (incomplete?'<b>'+incomplete+'</b> aineelta puuttuu pakollisia tietoja — ne tuodaan ehdotuksina täydennettäväksi.':'Kaikilla on vaaditut tiedot.')
        + '</div><div class="tblwrap"><table><thead><tr><th>Kauppanimi</th><th>Toimittaja</th><th>KTT</th><th>Säilytys</th><th>Tila</th></tr></thead><tbody>';
      var i; for(i=0;i<Math.min(res.rows.length,30);i++){ var r=res.rows[i];
        var d=isDuplicate(r), miss=missing(r).length;
        s+='<tr><td>'+esc(r.name)+'</td><td class="mono" style="font-size:.72rem;">'+esc(r.supplier)+'</td>'
          + '<td>'+(r.sdsUrl?"kyllä":"<b>puuttuu</b>")+'</td><td>'+esc(r.storeLoc||"—")+'</td>'
          + '<td>'+(d?'<span class="pill s-poistettu">jo rekisterissä</span>':(miss?'<span class="pill s-ehdotus">täydennettävä</span>':'<span class="pill s-hyvaksytty">valmis</span>'))+'</td></tr>'; }
      s+='</tbody></table></div>';
      if(res.rows.length>30) s+='<p class="mono" style="font-size:.7rem;">Näytetään 30 ensimmäistä.</p>';
      s+='<div class="btnrow"><button class="btn primary" id="impDo">Tuo rekisteriin</button></div>';
      out.innerHTML=s;
      var doBtn=document.getElementById("impDo");
      if(doBtn){ doBtn.addEventListener("click", function(){
        var by=document.getElementById("impBy").value.trim();
        if(by.length<2){ flash("Kirjoita tuojan nimi.","err"); return; }
        var added=0,skipped=0,asProp=0,i;
        for(i=0;i<importRows.length;i++){ var r=importRows[i];
          if(isDuplicate(r)){ skipped++; continue; }
          var c={}; var k; for(k in r){ if(r.hasOwnProperty(k)) c[k]=r[k]; }
          c.id=uid(); c.campus=curCampus(); c.source="PRO24";
          if(missing(c).length>0){ c.status="ehdotus"; c.proposedBy="PRO24-tuonti ("+by+")"; c.proposedAt=nowISO(); asProp++; }
          else { c.status="hyvaksytty"; c.decidedBy=by; c.decidedAt=nowISO(); }
          DB.items.push(c); added++;
        }
        logAdd("tuonti","PRO24",added+" ainetta tuotu"+(skipped?", "+skipped+" ohitettu päällekkäisenä":"")+(asProp?", "+asProp+" täydennettäväksi":""),by);
        importRows=null; save(); current="selaa"; statusF="";
        flash(added+" ainetta tuotu. "+(asProp?asProp+" odottaa täydennystä. ":"")+(skipped?skipped+" ohitettu.":""),"ok");
      }); }
    }); }
  }

  function bindPro24(){
    function dl(txt,name,mime){
      try{ var b=new Blob([txt],{type:mime}),u=URL.createObjectURL(b),a=document.createElement("a");
        a.href=u; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(u); },1000);
      }catch(e){ flash("Lataus ei onnistunut.","err"); }
    }
    function cc(x){ return String(x==null?"":x).replace(/;/g," ").replace(/[\r\n]+/g," "); }
    function pro24Rows(list){
      var rows=[PRO24_COLS.join(";")],i;
      for(i=0;i<list.length;i++){ var c=list[i];
        rows.push([cc(c.name),cc(c.supplier),cc(c.use),cc(c.h),cc(c.pStat),cc(c.ghs),cc(c.ppe),
          cc(c.storeLoc),cc(c.useLoc),cc(c.amount),cc(c.sdsUrl),cc(c.sdsDate),c.risk||"",
          c.asa?"kyllä":"ei",cc(c.campus),"käytössä"].join(";")); }
      return rows.join("\r\n");
    }
    function markSynced(list,by,how){
      var i; for(i=0;i<list.length;i++){ list[i].pro24SyncedAt=nowISO(); list[i].pro24How=how; }
      logAdd("vienti","PRO24",list.length+" ainetta viety ("+how+")",by); save();
    }
    var en=document.getElementById("expNew");
    if(en){ en.addEventListener("click", function(){
      var by=document.getElementById("expBy").value.trim();
      if(by.length<2){ flash("Kirjoita viejän nimi.","err"); return; }
      var list=inUse().filter(function(c){ return !c.pro24SyncedAt; });
      if(list.length===0){ flash("Ei viemättömiä aineita.","info"); return; }
      dl("\ufeff"+pro24Rows(list),"pro24_tuonti.csv","text/csv;charset=utf-8");
      markSynced(list,by,"tiedosto"); flash(list.length+" ainetta merkitty viedyksi.","ok"); }); }
    var ea=document.getElementById("expAll");
    if(ea){ ea.addEventListener("click", function(){
      var list=inUse(); if(list.length===0){ flash("Ei käytössä olevia aineita.","info"); return; }
      dl("\ufeff"+pro24Rows(list),"pro24_tuonti_kaikki.csv","text/csv;charset=utf-8"); }); }
    var ej=document.getElementById("expJson");
    if(ej){ ej.addEventListener("click", function(){
      dl(JSON.stringify({version:"1.0",generated:nowISO(),chemicals:inUse()},null,2),
         "kemikaalit_pro24.json","application/json"); }); }
    var sv=document.getElementById("sySave");
    if(sv){ sv.addEventListener("click", function(){
      DB.sync.endpoint=document.getElementById("syUrl").value.trim();
      DB.sync.apiKey=document.getElementById("syKey").value.trim();
      save(); flash("Asetukset tallennettu.","ok"); }); }
    var sd=document.getElementById("sySend");
    if(sd){ sd.addEventListener("click", function(){
      var url=document.getElementById("syUrl").value.trim(), key=document.getElementById("syKey").value.trim();
      var out=document.getElementById("syOut"), by=document.getElementById("expBy").value.trim();
      if(!url){ out.innerHTML='<div class="msg err">Syötä API-osoite. Ilman sitä käytä tiedostovientiä.</div>'; return; }
      if(by.length<2){ out.innerHTML='<div class="msg err">Kirjoita viejän nimi.</div>'; return; }
      var list=inUse().filter(function(c){ return !c.pro24SyncedAt; });
      if(list.length===0){ out.innerHTML='<div class="msg info">Ei viemättömiä aineita.</div>'; return; }
      out.innerHTML='<div class="msg info">Lähetetään '+list.length+' ainetta...</div>';
      var hdr={"Content-Type":"application/json"}; if(key) hdr["Authorization"]="Bearer "+key;
      fetch(url,{method:"POST",headers:hdr,body:JSON.stringify({chemicals:list})})
        .then(function(r){ if(r.ok){ markSynced(list,by,"rajapinta"); flash(list.length+" ainetta lähetetty.","ok"); }
          else { out.innerHTML='<div class="msg err">Palvelin vastasi virheellä '+r.status+'.</div>'; } })
        .catch(function(){ out.innerHTML='<div class="msg err">Yhteys ei onnistunut selaimesta (todennäköisesti CORS-rajoitus). Lähetys kuuluu tuotannossa palvelimelle — käytä toistaiseksi tiedostovientiä.</div>'; });
    }); }
  }

  // ================= LUETTELO =================
  function viewList(){
    var use=inUse();
    var s='<p class="lead">Lakisääteinen kemikaaliluettelo. Tulosta ja pidä saatavilla kemikaalivarastossa, pelastussuunnitelman liitteenä ja palokunnalle tilakartan yhteydessä.</p>'
      + '<div class="btnrow" style="margin-bottom:12px;"><button class="btn primary" id="printList">Tulosta luettelo</button>'
      + '<button class="btn" id="expList">Vie CSV</button></div>';
    if(use.length===0) return s+'<div class="panel"><p class="lead" style="margin:0;">Ei käytössä olevia aineita.</p></div>';
    s+='<div class="panel"><h3>Kemikaaliluettelo — '+esc(campuses().filter(function(c){return c.code===curCampus();}).map(function(c){return c.name;})[0]||"")+'</h3>'
      + '<p class="mono" style="font-size:.66rem;color:var(--ink-soft);">Tulostettu '+fmt(nowISO())+' · '+use.length+' ainetta · VNa 715/2001 mukainen</p>'
      + '<div class="tblwrap"><table><thead><tr><th>Kauppanimi</th><th>Luokitus (H)</th><th>GHS</th><th>KTT</th><th>Päiväys</th><th>Säilytys</th><th>Käyttöpaikka</th></tr></thead><tbody>';
    var i; for(i=0;i<use.length;i++){ var c=use[i];
      s+='<tr><td><b>'+esc(c.name)+'</b>'+(c.asa?' <span class="pill p-asa">ASA</span>':'')+'<br><span class="mono" style="font-size:.7rem;color:var(--ink-soft);">'+esc(c.supplier||"")+'</span></td>'
        + '<td>'+esc(c.h||"—")+'</td><td>'+esc(c.ghs||"—")+'</td>'
        + '<td>'+((c.sdsUrl||c.sdsFile)?"kyllä":"<b>EI</b>")+'</td><td>'+fmtD(c.sdsDate)+'</td>'
        + '<td>'+esc(c.storeLoc||"—")+'</td><td>'+esc(c.useLoc||"—")+'</td></tr>'; }
    s+='</tbody></table></div></div>';

    var asa=use.filter(function(c){ return c.asa; });
    if(asa.length>0){
      s+='<div class="panel"><h3>ASA-seuranta</h3>'
        + '<p style="font-size:.9rem;">Syöpävaaralliset aineet. Altistuvista työntekijöistä on pidettävä erillistä luetteloa (ASA-laki 452/2020).</p>'
        + '<div class="tblwrap"><table><thead><tr><th>Kauppanimi</th><th>Luokitus</th><th>Käyttöpaikka</th></tr></thead><tbody>';
      for(i=0;i<asa.length;i++){ s+='<tr><td>'+esc(asa[i].name)+'</td><td>'+esc(asa[i].h||"—")+'</td><td>'+esc(asa[i].useLoc||"—")+'</td></tr>'; }
      s+='</tbody></table></div></div>';
    }
    return s;
  }
  function bindList(){
    var p=document.getElementById("printList"); if(p){ p.addEventListener("click", function(){ window.print(); }); }
    var e=document.getElementById("expList");
    if(e){ e.addEventListener("click", function(){
      function cc(x){ return String(x==null?"":x).replace(/;/g," "); }
      var rows=["Kauppanimi;Toimittaja;H-lausekkeet;GHS;KTT olemassa;KTT paivays;Sailytys;Kayttopaikka;ASA"],i;
      var use=inUse();
      for(i=0;i<use.length;i++){ var c=use[i];
        rows.push([cc(c.name),cc(c.supplier),cc(c.h),cc(c.ghs),(c.sdsUrl||c.sdsFile)?"kyllä":"EI",
          cc(c.sdsDate),cc(c.storeLoc),cc(c.useLoc),c.asa?"kyllä":""].join(";")); }
      try{ var b=new Blob(["\ufeff"+rows.join("\r\n")],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
        a.href=u; a.download="kemikaaliluettelo.csv"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }catch(err){ flash("Lataus ei onnistunut.","err"); } }); }
  }

  // ================= ASETUKSET =================
  function viewSettings(){
    var s='<div class="panel"><span class="kicker">Käyttöoikeus</span><h3>Tunnusluku</h3>'
      + '<p style="font-size:.9rem;">Roolia vaihdetaan sivun yläreunasta. Tunnusluku suojaa henkilökunnan tilaa — se on käyttöliittymän suoja, ei tietoturva.</p>'
      + (STAFF?('<div class="field" style="max-width:260px;"><label>Vaihda tunnusluku (tyhjä = ei lukitusta)</label><input type="text" id="newPin" value="'+esc(DB.pin)+'"></div>'
        + '<div class="btnrow"><button class="btn ghost" id="savePin">Tallenna</button></div>')
        :'<div class="msg info">Avaa henkilökunnan tila yläreunan painikkeesta.</div>')
      + '</div>';
    s+='<div class="panel"><span class="kicker">Moodle</span><h3>Käyttöönotto</h3>'
      + '<p style="font-size:.9rem;">Tämä työkalu viedään Moodleen tiedostona (Lisää aineisto → Tiedosto). Vie mukana <code>paja-data.js</code> ja <code>pajakuutio-nav.js</code> samaan kansioon. Jatkossa tieto voidaan siirtää Metropolian omaan järjestelmään — vienti on jo olemassa PRO24-välilehdellä.</p></div>';
    s+='<div class="panel"><span class="kicker">Varmuuskopio</span><h3>Vie ja tuo</h3><div class="btnrow">'
      + '<button class="btn" id="expBk">Varmuuskopio (JSON)</button>'
      + (STAFF?'<label class="btn ghost" style="cursor:pointer;">Tuo varmuuskopio<input type="file" id="impBk" accept="application/json" style="display:none;"></label>':'')
      + '</div></div>';
    s+='<div class="panel"><span class="kicker">Loki</span><h3>Päätökset ja siirrot</h3>';
    if(DB.log.length===0) s+='<p class="lead" style="margin:0;">Loki on tyhjä.</p>';
    else { var i,n=0; for(i=DB.log.length-1;i>=0&&n<40;i--,n++){ var l=DB.log[i];
      s+='<div class="mono" style="font-size:.66rem;padding:.3em 0;border-bottom:1px dashed var(--rule);">'
        + '<span style="color:var(--ink-soft);">'+fmt(l.ts)+'</span> · <b>'+esc(l.kind)+'</b> · '+esc(l.ref)+' — '+esc(l.text)
        + ' <span style="color:var(--ink-soft);">'+esc(l.by)+'</span></div>'; } }
    return s+'</div>';
  }
  function bindSettings(){
    var sp=document.getElementById("savePin"); if(sp){ sp.addEventListener("click", function(){ DB.pin=document.getElementById("newPin").value.trim(); save(); flash("Tallennettu.","ok"); }); }
    var eb=document.getElementById("expBk");
    if(eb){ eb.addEventListener("click", function(){
      try{ var b=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"}),u2=URL.createObjectURL(b),a=document.createElement("a");
        a.href=u2; a.download="kemikaalit_varmuuskopio.json"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }catch(e){ flash("Lataus ei onnistunut.","err"); } }); }
    var ib=document.getElementById("impBk");
    if(ib){ ib.addEventListener("change", function(){ if(!ib.files[0]) return; var fr=new FileReader();
      fr.onload=function(){ try{ var d=JSON.parse(fr.result);
        if(!window.confirm("Tuonti korvaa nykyiset tiedot. Jatketaanko?")) return;
        DB.items=d.items||[]; DB.log=d.log||[]; DB.pin=d.pin||""; DB.sync=d.sync||{endpoint:"",apiKey:""};
        save(); flash("Varmuuskopio tuotu.","ok");
      }catch(e){ flash("Tiedostoa ei voitu lukea.","err"); } }; fr.readAsText(ib.files[0]); }); }
  }

  // ================= ROUTER =================
  var TABS=[
    { id:"selaa",   label:"Kemikaalit",  render:viewBrowse,  bind:bindBrowse },
    { id:"lisaa",   label:"Lisää",       render:viewAdd,     bind:bindAdd },
    { id:"hyvaksy", label:"Hyväksyntä",  render:viewApprove, bind:bindApprove, staff:true },
    { id:"luettelo",label:"Luettelo & PRO24", render:viewListPro, bind:bindListPro },
    { id:"asetukset",label:"Asetukset",  render:viewSettings, bind:bindSettings }
  ];
  function viewListPro(){ return viewList()+(STAFF?viewPro24():""); }
  function bindListPro(){ bindList(); if(STAFF) bindPro24(); }
  function render(){
    var el=document.getElementById("tabs"),s="",i,pend=pending().length;
    for(i=0;i<TABS.length;i++){
      if(TABS[i].staff && !STAFF) continue;
      var extra=(TABS[i].id==="hyvaksy"&&pend>0)?'<span class="n">'+pend+'</span>':"";
      s+='<button class="tab'+(TABS[i].id===current?" active":"")+'" data-tab="'+TABS[i].id+'">'+TABS[i].label+extra+'</button>'; }
    if(!STAFF && current==="hyvaksy"){ current="selaa"; }
    el.innerHTML=s;
    el.querySelectorAll("[data-tab]").forEach(function(b){ b.addEventListener("click", function(){ current=b.getAttribute("data-tab"); openId=""; flashMsg=null; render(); }); });
    // Roolinvaihto aina näkyvissä
    var rsw=document.getElementById("roleSwitch");
    if(rsw){
      rsw.innerHTML='<button class="rs'+(STAFF?"":" on")+'" id="rsStud"><span class="ic">\u25CB</span>Opiskelija</button>'
        + '<button class="rs'+(STAFF?" on staff":"")+'" id="rsStaff"><span class="ic">\u25CF</span>Henkilökunta</button>';
      document.getElementById("rsStud").addEventListener("click", function(){ STAFF=false; render(); });
      document.getElementById("rsStaff").addEventListener("click", function(){
        if(STAFF) return;
        if(!DB.pin){ STAFF=true; render(); return; }
        var v=window.prompt("Henkilökunnan tunnusluku:");
        if(v===DB.pin){ STAFF=true; render(); } else if(v!==null){ flash("Väärä tunnusluku.","err"); }
      });
    }
    // Automaattiset KTT-hälytykset
    var al=document.getElementById("alerts");
    if(al){
      var use=inUse(), old=[], noSds=[], k;
      for(k=0;k<use.length;k++){
        var yy=yearsSince(use[k].sdsDate);
        if(yy!=null&&yy>3) old.push(use[k]);
        if(!use[k].sdsUrl&&!use[k].sdsFile) noSds.push(use[k]);
      }
      var a="";
      if(noSds.length>0){
        a+='<div class="alertbar crit"><span class="ai">!</span><span class="at"><b>'+noSds.length
         + ' ainetta ilman käyttöturvallisuustiedotetta</b>Näitä aineita ei saa käyttää. Hanki KTT tai poista aine käytöstä. '
         + esc(noSds.slice(0,4).map(function(c){return c.name;}).join(", "))+(noSds.length>4?" ja muita":"")+'</span></div>';
      }
      if(old.length>0){
        a+='<div class="alertbar"><span class="ai">\u21BB</span><span class="at"><b>'+old.length
         + ' käyttöturvallisuustiedotetta yli 3 vuotta vanha</b>Tarkista PRO24:stä onko uudempi versio. '
         + esc(old.slice(0,4).map(function(c){return c.name+" ("+fmtD(c.sdsDate)+")";}).join(", "))+(old.length>4?" ja muita":"")+'</span></div>';
      }
      al.innerHTML=a;
    }
    var t=null; for(i=0;i<TABS.length;i++){ if(TABS[i].id===current) t=TABS[i]; }
    var html=t.render();
    if(flashMsg){ html='<div class="msg '+flashMsg.k+'">'+esc(flashMsg.t)+'</div>'+html; flashMsg=null; }
    document.getElementById("view").innerHTML=html;
    if(t.bind) t.bind();
    document.getElementById("note").innerHTML=
      "Kemikaalivastuu on työnantajalla (VNa 715/2001, TTL 738/2002): ainetta ei saa käyttää ilman varoitusmerkintöjä ja käyttöturvallisuustiedotetta. "
      + "Luettelo on pidettävä ajan tasalla ja saatavilla kemikaalivarastossa, pelastussuunnitelmassa ja palokunnalle. "
      + "PRO24 on virallinen rekisteri — tämä työkalu siirtää tiedon sinne, ei korvaa sitä. Pilotti: tiedot tallentuvat selaimeen.";
  }

  load(); render();
})();
</script>
<script src="paja-footer.js"></script>
</body>
